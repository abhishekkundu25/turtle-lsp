name: Pages

# The browser editor and toolbox (web/app), built from a commit of main and
# published to GitHub Pages. Everything runs in the visitor's browser: the
# site is static files (the engine as WebAssembly, Monaco, the pages).
#
# A push to main deploys only after the CI workflow (which builds and tests
# the browser engine, job "web") passed on that commit; a failed CI run
# publishes nothing. A run started by hand republishes main without waiting.
# CI runs on main are never cancelled, so they can finish out of order: only a
# build of the current tip of main is published, never an older commit over a
# newer one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (tags can be moved); Dependabot bumps them.
jobs:
  build:
    name: Build the site
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed on (a workflow_run runs on the default branch's tip).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # The compiler pinned in rust-toolchain.toml, with the browser target.
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web/engine
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The engine (web/engine) for wasm32, then Monaco and monaco-vim beside the pages.
      - run: node web/build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/app

  # A CI run for an older commit can finish after the run for a newer one.
  tip:
    name: Built commit is the tip of main
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.tip.outputs.current }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUILT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - id: tip
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$BUILT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $BUILT: main has moved on to $tip."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Publish
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
