[package]
name = "turtle-lsp"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Fast language server for RDF Turtle"
repository = "https://github.com/abhishekkundu25/turtle-lsp"

[dependencies]
crossbeam-channel = "0.5.17"
line-index = "0.1.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
mimalloc = { version = "0.1", default-features = false }
oxilangtag = "0.1.6"
oxiri = "0.3.1"
oxrdfxml = { version = "0.2.4", features = ["rdf-12"] }
rayon = "1.12.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spareval = { version = "0.2", features = ["sparql-12", "sep-0006"] }
spargebra = { version = "0.4", features = ["sparql-12"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxttl = { version = "0.2.4", features = ["rdf-12"] }
