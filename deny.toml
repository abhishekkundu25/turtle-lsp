# cargo deny check: vulnerable crates, licences, duplicate/banned crates and
# where crates may come from. Run in CI; locally: cargo deny check

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
version = 2
yanked = "deny"
ignore = [
    # quick-xml < 0.41 (0.37.5 in the lock file): quadratic attribute-duplicate check
    # and namespace allocation, both proportional to the size of one start tag. It is
    # reached through two crates:
    #   - oxrdfxml 0.2.4 (the latest release), which parses RDF/XML owl:imports.
    #     src/imports/rdfxml.rs refuses any start tag over 64 KiB before parsing, on
    #     inputs of at most 20 MB (network) / 50 MB (files). The language server runs
    #     it on a background thread; `turtle-lsp check` runs it inline, where the
    #     scan costs about 0.3 s per MB (audit measurement, 2026-10).
    #   - sparesults 0.3.4, through spareval. Its XML reader runs only for the
    #     results of a SERVICE call, and turtle-lsp registers no service handler
    #     (src/ has none), so it never parses a document.
    # Re-check by 2027-01-22: drop both entries once oxrdfxml and sparesults release
    # a quick-xml >= 0.41, or when a new input path reaches either parser.
    { id = "RUSTSEC-2026-0194", reason = "RDF/XML start tags capped at 64 KiB before parsing (src/imports/rdfxml.rs); no SERVICE handler, so sparesults never parses XML here; re-check 2027-01-22" },
    { id = "RUSTSEC-2026-0195", reason = "RDF/XML start tags capped at 64 KiB before parsing (src/imports/rdfxml.rs); no SERVICE handler, so sparesults never parses XML here; re-check 2027-01-22" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# ISC, BSD-3-Clause and CDLA-Permissive-2.0 come with the HTTPS client used to
# fetch owl:imports (rustls, ring, rustls-webpki, untrusted, subtle,
# webpki-roots); all are permissive, attribution-only licences.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
