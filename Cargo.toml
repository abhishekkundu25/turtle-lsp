[package]
name = "turtle-lsp"
version = "0.18.0"
edition = "2024"
# 1.99: the highest `rust-version` among the dependencies is TurbOWL's (1.99). Without
# it, `str::floor_char_boundary` (src/query/mod.rs, 1.91) would be the floor. CI builds
# with rust-toolchain.toml. Lower this only after clippy passes on the lower number.
rust-version = "1.99"
license = "MIT"
description = "Fast language server and command-line checker for RDF (Turtle, TriG, N-Triples, N-Quads, JSON-LD) and SPARQL, with SHACL validation"
repository = "https://github.com/abhishekkundu25/turtle-lsp"

# main.rs has no tests of its own, so `cargo test` does not link it as a test
# binary. The integration tests still get the binary they run.
[[bin]]
name = "turtle-lsp"
path = "src/main.rs"
test = false

[dependencies]
crossbeam-channel = "0.5.17"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
oxilangtag = "0.1.6"
# Two oxiri versions are in the tree on purpose: this crate parses and resolves IRIs
# with 0.3, while the Oxigraph crates (oxrdf, spargebra, spareval, oxttl, oxjsonld)
# still depend on 0.2.
oxiri = "0.3.1"
oxrdfxml = { version = "0.2.4", features = ["rdf-12"] }
rayon = "1.12.0"
# Default features: spareval turns them on anyway and Cargo unifies features, so a
# trimmed list here would change nothing but the manifest.
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Exact pins: a [patch.crates-io] entry below only applies while the registry version
# it replaces still satisfies the requirement. With "0.2", `cargo update` would pick a
# published 0.2.8, ignore the patch (a warning) and drop the cancellation checks.
spareval = { version = "=0.2.7", features = ["sparql-12", "sep-0006"] }
spargebra = { version = "=0.4.7", features = ["sparql-12"] }
# The RDF terms spargebra re-exports, and their borrowed forms (`TermRef`,
# `TripleRef`), which it does not: the reasoning base hands TurbOWL borrowed
# triples. The version spargebra and TurbOWL use.
oxrdf = { version = "0.3", features = ["rdf-12"] }
# TurbOWL, the OWL 2 RL reasoner behind `turtle.reasoning` (src/reasoning/), from its
# public repository at a release tag (it is not on crates.io; deny.toml allows that one
# git source). Without its default features: turtle-lsp
# parses, so its parsers and its thread pool stay out. `rdf-12` because oxrdf has it
# here (through spargebra and oxrdfxml), and TurbOWL does not compile otherwise.
turbowl = { version = "0.2.2", git = "https://github.com/abhishekkundu25/turbowl", tag = "v0.2.2", default-features = false, features = ["rdf-12"] }
url = "2.5.8"

# Not in the browser build (web/engine): no C allocator, no network client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
oxttl = { version = "0.2.4", features = ["rdf-12"] }
oxjsonld = { version = "0.2.6", features = ["rdf-12"] }
# The old position conversion, the oracle of `analysis::tests`.
line-index = "0.1.2"

# spareval 0.2.7 with cancellation checks inside its joins (vendor/spareval/PATCH.md).
[patch.crates-io]
spareval = { path = "vendor/spareval" }
# spargebra 0.4.7 with four patches (vendor/spargebra/PATCH.md).
spargebra = { path = "vendor/spargebra" }

# Whole-program optimisation, one codegen unit, no symbols.
# `panic` stays "unwind": Server::guarded, the worker and SHACL threads catch handler
# panics (catch_unwind), and a query's Stop cancellation unwinds out of spareval's joins
# (src/query/mod.rs, vendor/spareval/PATCH.md). The browser build (web/engine) has its
# own profile.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
