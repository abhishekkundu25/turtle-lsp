<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtle RDF Toolbox</title>
</head>
<body>
<!--
  PROTOTYPE, throwaway. Question: "what should a browser-only RDF toolbox built on
  turtle-lsp look like when it is organised around five equal tools (Format,
  Validate, SHACL, SPARQL, Convert) sharing one input, not around validation?"
  Three structurally different variants, switchable with #A / #B / #C, the pink
  bar at the bottom, or the left/right arrow keys:
    A  Tool tabs    - five equal tabs over a split screen: input left, tool right
    B  Tool home    - a home grid of five live tool tiles that opens a full-page workspace
    C  Command editor - one editor; a tool rail and a command bar change what it shows
  Diagnostics and formatter output are REAL turtle-lsp output for the samples.
  Fix edits, conversion, expand/shorten/organise and graphs.trig are written by
  the prototype and labelled MOCKED on screen.
-->
<style>
*{box-sizing:border-box}
.tbx{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.tbx button,.tbx select,.tbx input,.tbx textarea{font:inherit;color:inherit}
.tbx button{cursor:pointer}
.mono,.src,.tbx pre,.tbx code,.tbx textarea{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.mock{display:inline-block;font:700 9.5px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:4px;background:#fde68a;color:#713f12;vertical-align:middle;white-space:nowrap}
.real{display:inline-block;font:700 9.5px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:4px;background:#bbf7d0;color:#14532d;vertical-align:middle;white-space:nowrap}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* source view shared mechanics; colours come from each variant's custom properties */
.src{font-size:12.5px;line-height:19px;padding:6px 0}
.ln{display:flex;min-width:0}
.ln .no{flex:0 0 38px;text-align:right;padding-right:10px;color:var(--ln);user-select:none}
.ln .tx{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-right:8px}
.ln.add{background:var(--addbg)} .ln.del{background:var(--delbg)}
.ln.add .no,.ln.del .no{color:var(--tx)}
.ln.gap .tx{color:var(--ln);font-style:italic}
.ln.hl{background:var(--hlbg)}
.t1{color:var(--com);font-style:italic}.t2{color:var(--str)}.t3{color:var(--iri)}.t4{color:var(--lang)}.t5{color:var(--var)}.t6{color:var(--pn)}.t7{color:var(--num)}.t8{color:var(--kw);font-weight:600}
.mk{border-bottom:2px solid;cursor:pointer}
.mk.s1{border-color:#e5484d;background:rgba(229,72,77,.13)}
.mk.s2{border-color:#e29a12;background:rgba(226,154,18,.14)}
.mk.s4{border-color:var(--ln);border-bottom-style:dotted}
.mk.hot{background:var(--consbg);border-bottom-color:var(--acc);border-bottom-width:3px}
.mk.cons{border-color:var(--acc);background:var(--consbg)}

/* ---------- prototype switcher (not part of the design) ---------- */
#pbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:1000;display:flex;align-items:center;gap:4px;background:#ff2d78;color:#fff;border-radius:999px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.35);font:600 13px system-ui,sans-serif;white-space:nowrap;max-width:calc(100vw - 32px)}
#pbar button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;min-width:34px;height:34px;padding:0 10px;font:600 13px system-ui,sans-serif;cursor:pointer}
#pbar .lbl{padding:0 6px;overflow:hidden;text-overflow:ellipsis}
#pstate{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:1000;width:min(540px,calc(100vw - 32px));max-height:45vh;overflow:auto;background:#111;color:#a7f3d0;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:10px;margin:0;white-space:pre-wrap;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:1001;background:#111;color:#fff;padding:7px 14px;border-radius:8px;font:13px system-ui,sans-serif;max-width:calc(100vw - 32px)}

/* ============================ A: Tool tabs (light) ============================ */
.vA{--tx:#1d2330;--ln:#9aa3b2;--com:#6b7686;--str:#0a7a3e;--iri:#1f56c2;--lang:#a14b00;--var:#8a2bb3;--pn:#0b5d8f;--num:#b3261e;--kw:#c0136b;--acc:#2557d6;--addbg:#e3f6e8;--delbg:#fde8e8;--hlbg:#fff6cc;--consbg:rgba(37,87,214,.12);background:#f4f5f8;color:#1d2330}
.a-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 24px;background:#ffffff;border-bottom:1px solid #dde1e8}
.a-brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.a-logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:#1d2330;color:#ffffff;font:700 12px ui-monospace,Menlo,monospace}
.a-brand b{font-size:16px}
.a-sub{color:#5d6675;font-size:13px}
.a-priv{color:#1a7f37;font-size:12.5px}
.a-tabs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0;background:#ffffff;border-bottom:1px solid #dde1e8;padding:0 24px}
.a-tab{border:0;background:transparent;color:#4a5363;padding:12px 8px 11px;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;min-width:0}
.a-tab .g{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#eef1f6;color:#4a5363;font-size:13px}
.a-tab .c{font-size:11px;padding:1px 7px;border-radius:9px;background:#eef1f6;color:#4a5363}
.a-tab .c.bad{background:#fde8e8;color:#b42318}
.a-tab .c.ok{background:#e3f6e8;color:#1a7f37}
.a-tab.on{color:#1d2330;border-bottom-color:#2557d6}
.a-tab.on .g{background:#2557d6;color:#ffffff}
.a-note{font-size:12px;color:#7a8394;padding:6px 24px 0}
.a-main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;padding:16px 24px;align-items:start}
.a-pane{background:#ffffff;border:1px solid #dde1e8;border-radius:10px;min-width:0;overflow:hidden}
.a-pane-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #e6e9ef;background:#fafbfc}
.a-pane-hd h2{margin:0;font-size:14px}
.a-pane-hd p{margin:0;color:#5d6675;font-size:12.5px;flex-basis:100%}
.a-scroll{max-height:62vh;overflow:auto}
.a-ft{padding:4px 24px 0;color:#7a8394;font-size:12px}

/* shared input pane (A uses it; B/C restyle) */
.files{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--chipb);background:var(--chipbg);color:var(--tx);border-radius:7px;padding:4px 6px 4px 9px;font:12.5px ui-monospace,Menlo,monospace}
.fchip.on{border-color:var(--acc);box-shadow:inset 0 -2px var(--acc)}
.fchip .n{font:600 10.5px system-ui,sans-serif;padding:1px 6px;border-radius:9px;background:var(--badbg);color:var(--badtx)}
.fchip .n.ok{background:var(--okbg);color:var(--oktx)}
.fchip .n.na{background:var(--nabg);color:var(--natx)}
.fchip .x{border:0;background:transparent;color:var(--ln);padding:0 2px;font-size:14px;line-height:1}
.fchip .nm{border:0;background:transparent;padding:0;font:inherit;color:inherit}
.intools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px}
.ibtn{border:1px solid var(--chipb);background:var(--chipbg);color:var(--tx);border-radius:7px;padding:5px 10px;font-size:12.5px}
.ibtn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.ibtn:disabled{opacity:.5;cursor:default}
.isel{border:1px solid var(--chipb);background:var(--chipbg);color:var(--tx);border-radius:7px;padding:5px 8px;font-size:12.5px;max-width:100%}
.ihint{font-size:12px;color:var(--ln)}
.ita{display:block;width:calc(100% - 24px);margin:0 12px 12px;min-height:260px;border:1px solid var(--chipb);background:var(--chipbg);color:var(--tx);border-radius:8px;padding:10px;font-size:12.5px;line-height:19px}
.banner{margin:8px 12px;padding:8px 10px;border-radius:8px;background:var(--warnbg);color:var(--warntx);font-size:12.5px}
.vA{--chipb:#d4d9e2;--chipbg:#ffffff;--badbg:#fde8e8;--badtx:#b42318;--okbg:#e3f6e8;--oktx:#1a7f37;--nabg:#eef1f6;--natx:#5d6675;--onacc:#ffffff;--warnbg:#fff4d6;--warntx:#6b4500}

/* shared tool fragments */
.tsec{padding:12px}
.thd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.thd .sp{flex:1}
.guar{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--okbg);color:var(--oktx)}
.stat{font-size:12.5px;color:var(--ln)}
.stat b.p{color:#1a7f37}.stat b.m{color:#c0362c}
.seg{display:inline-flex;border:1px solid var(--chipb);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--chipbg);color:var(--tx);padding:4px 10px;font-size:12.5px}
.seg button.on{background:var(--acc);color:var(--onacc)}
.seg button:disabled{opacity:.45;cursor:default}
.langs{display:flex;flex-wrap:wrap;gap:4px}
.lang{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--chipb);color:var(--ln)}
.lang.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.box{border:1px solid var(--chipb);border-radius:8px;overflow:hidden;background:var(--chipbg)}
.why{font-size:12.5px;color:var(--ln);margin:8px 0 0}
.empty{padding:16px;color:var(--ln);font-size:13px}
.pi{border:1px solid var(--chipb);border-left:4px solid #e5484d;border-radius:8px;padding:9px 10px;margin-bottom:8px;background:var(--chipbg)}
.pi.s2{border-left-color:#e29a12}.pi.s4{border-left-color:var(--ln)}
.pi.hot{box-shadow:0 0 0 2px var(--acc)}
.pi-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12px}
.sev{font:700 10.5px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em}
.sev.s1{color:#c0362c}.sev.s2{color:#a86a00}.sev.s4{color:var(--ln)}
.pos{font-family:ui-monospace,Menlo,monospace;color:var(--ln)}
.code{font-family:ui-monospace,Menlo,monospace;color:var(--ln);font-size:11.5px}
.pi-m{margin:3px 0 0;font-size:13px;overflow-wrap:anywhere;cursor:pointer}
.pi details{font-size:12px;color:var(--ln);margin-top:4px}
.pi details div{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding-left:12px}
.fx{margin-top:8px;border:1px solid var(--chipb);border-radius:7px;overflow:hidden}
.fx-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;font-size:12.5px;font-weight:600}
.fx-h .sp{flex:1}
.fbtn{border:0;background:#1f883d;color:#ffffff;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600}
.fx .src{padding:2px 0;font-size:12px;line-height:18px}
.nofix{font-size:12px;color:var(--ln);margin-top:6px}
.grp{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ln);margin:14px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grp:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--chipb);border-radius:8px;margin-bottom:8px;font-size:13px}
.row .sp{flex:1}
.lnk{border:0;background:transparent;color:var(--acc);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.okline{color:var(--oktx);font-size:13px;padding:4px 0}
.gridwrap{overflow-x:auto;border:1px solid var(--chipb);border-radius:8px;background:var(--chipbg)}
table.shg{border-collapse:collapse;width:100%;font-size:12.5px}
.shg th,.shg td{border-bottom:1px solid var(--chipb);border-right:1px solid var(--chipb);padding:6px 8px;text-align:center;vertical-align:middle}
.shg th{font-weight:600;font-size:11.5px;color:var(--ln)}
.shg th .pth{display:block;font-family:ui-monospace,Menlo,monospace;color:var(--tx);font-size:11.5px}
.shg td.fn,.shg th.fn{text-align:left;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.shg td.c{cursor:pointer;min-width:58px}
.shg td.pass{color:var(--oktx)}
.shg td.fail{background:var(--badbg);color:var(--badtx);font-weight:600}
.shg td.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.shg td small{display:block;font-weight:400;font-family:ui-monospace,Menlo,monospace;font-size:11px;overflow-wrap:anywhere}
.det{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.det .msg{grid-column:1/-1;font-size:13px}
.det h4{margin:0;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--chipb);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cvopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.cvlab{font-size:12px;color:var(--ln);min-width:44px}
.warnl{font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--warnbg);color:var(--warntx);margin:8px 0}
.vA .pi,.vA .box,.vA .gridwrap{background:#ffffff}

/* ============================ B: Tool home (warm light) ============================ */
.vB{--tx:#2b2620;--ln:#9a8f7c;--com:#8a7f6d;--str:#2f7d32;--iri:#2b5aa8;--lang:#a35200;--var:#8b3fa8;--pn:#1d6a7a;--num:#b23a1f;--kw:#b4441c;--acc:#b4441c;--addbg:#e6f2df;--delbg:#f9e3dc;--hlbg:#fbefc5;--consbg:rgba(180,68,28,.12);--chipb:#e3dccb;--chipbg:#fffdf8;--badbg:#f9e3dc;--badtx:#a3321b;--okbg:#e6f2df;--oktx:#2f6b2a;--nabg:#efe9dc;--natx:#6d6455;--onacc:#ffffff;--warnbg:#fbefc5;--warntx:#664a00;background:#f7f3ea;color:#2b2620}
.b-wrap{max-width:1240px;margin:0 auto;padding:28px 24px 0}
.b-hd h1{font:700 30px/1.15 Georgia,"Iowan Old Style",serif;margin:0 0 6px;letter-spacing:-.01em}
.b-hd p{margin:0;color:#6d6455;font-size:15px;max-width:720px}
.b-priv{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:#2f6b2a;background:#e6f2df;border-radius:999px;padding:4px 10px}
.b-drop{margin-top:22px;border:2px dashed #d6ccb6;border-radius:14px;background:#fffdf8;padding:14px}
.b-drop-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-drop-top b{font-size:15px}
.b-drop-top .sp{flex:1}
.b-ftab{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.b-ftab td{padding:6px 8px;border-top:1px solid #efe9dc}
.b-ftab td.nm{font-family:ui-monospace,Menlo,monospace}
.b-ftab td.st{text-align:right}
.b-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:22px}
.b-tile{text-align:left;border:1px solid #e3dccb;background:#fffdf8;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;color:#2b2620;min-width:0;box-shadow:0 1px 0 #e3dccb}
.b-tile:hover{border-color:#b4441c}
.b-tile .tg{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#f3e3d6;color:#b4441c;font-size:17px;font-weight:700}
.b-tile h3{margin:0;font:700 19px Georgia,serif}
.b-tile .job{margin:0;font-size:13px;color:#6d6455;min-height:56px}
.b-live{border-top:1px solid #efe9dc;padding-top:8px}
.b-live b{display:block;font:700 26px Georgia,serif}
.b-live span{font-size:12.5px;color:#6d6455}
.b-go{margin-top:auto;font-weight:600;color:#b4441c;font-size:13px}
.b-tile.ghost{border-style:dashed;background:transparent;box-shadow:none}
.b-ft{margin-top:22px;font-size:12px;color:#9a8f7c}
.b-ws-top{position:sticky;top:0;z-index:5;background:#f7f3ea;border-bottom:1px solid #e3dccb}
.b-ws-bar{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.b-back{border:1px solid #e3dccb;background:#fffdf8;border-radius:999px;padding:5px 12px;font-weight:600}
.b-seg{display:flex;gap:4px;flex-wrap:wrap}
.b-seg button{border:1px solid transparent;background:transparent;border-radius:999px;padding:5px 12px;font-weight:600;color:#6d6455}
.b-seg button.on{background:#2b2620;color:#fffdf8}
.b-seg button .c{font-size:11px;margin-left:5px;opacity:.8}
.b-inbar{max-width:1240px;margin:0 auto;padding:0 24px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#6d6455}
.b-inbar .files{padding:0}
.b-tool{max-width:1240px;margin:0 auto;padding:18px 24px 0}
.b-tool>h2{font:700 26px Georgia,serif;margin:0}
.b-tool>p.job{margin:2px 0 14px;color:#6d6455}
.b-inbox{max-width:1240px;margin:0 auto 10px;padding:0 24px}
.b-inbox .box{background:#fffdf8}
.b-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.b-flist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.b-frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #e3dccb;background:#fffdf8;border-radius:10px;padding:8px 12px;text-align:left;color:#2b2620}
.b-frow.on{border-color:#b4441c;box-shadow:inset 3px 0 #b4441c}
.b-frow .nm{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.b-frow .sp{flex:1}
.b-cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.b-cat .pi{margin:0}
.b-sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#fffdf8;border:1px solid #e3dccb;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.b-sum .k{font:700 24px Georgia,serif}
.b-sum .l{font-size:12px;color:#6d6455}
.b-sum .sp{flex:1}
.b-big{display:flex;gap:8px;flex-wrap:wrap}
.b-big button{border:1px solid #e3dccb;background:#fffdf8;border-radius:10px;padding:10px 14px;text-align:left;min-width:120px;color:#2b2620}
.b-big button b{display:block;font-size:14px}
.b-big button span{font-size:11.5px;color:#6d6455}
.b-big button.on{border-color:#b4441c;background:#f3e3d6}
.b-big button:disabled{opacity:.45;cursor:default}
.b-arrow{font:700 22px Georgia,serif;color:#b4441c;padding:0 4px}

/* ============================ C: Command editor (dark) ============================ */
.vC{--tx:#d6dde6;--ln:#5f6b7a;--com:#6f7d8f;--str:#9ccc7e;--iri:#7cc4ff;--lang:#e5b567;--var:#d59cf2;--pn:#66d9c9;--num:#f78c6c;--kw:#ff7ab2;--acc:#7cc4ff;--addbg:rgba(64,180,90,.17);--delbg:rgba(229,72,77,.17);--hlbg:rgba(255,214,102,.12);--consbg:rgba(124,196,255,.16);--chipb:#2a313b;--chipbg:#161b22;--badbg:rgba(229,72,77,.18);--badtx:#ff9a9e;--okbg:rgba(64,180,90,.18);--oktx:#8fe0a0;--nabg:#222933;--natx:#9aa6b4;--onacc:#0b1520;--warnbg:rgba(226,154,18,.16);--warntx:#f3c46b;background:#0f1216;color:#d6dde6}
.c-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #222933;background:#0b0e12}
.c-logo{font:700 12px ui-monospace,Menlo,monospace;color:#0b0e12;background:#7cc4ff;border-radius:6px;padding:5px 7px}
.c-cmd{position:relative;flex:1;min-width:0;max-width:760px;margin:0 auto}
.c-cmd input{width:100%;background:#161b22;border:1px solid #2f3742;border-radius:8px;padding:8px 12px 8px 30px;color:#d6dde6;font-size:13.5px;outline:none}
.c-cmd input:focus{border-color:#7cc4ff}
.c-cmd .pr{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#7cc4ff;font-weight:700}
.c-sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#161b22;border:1px solid #2f3742;border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.c-sugg button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;color:#d6dde6;padding:7px 12px;font-size:13px}
.c-sugg button.sel{background:#1f2a37}
.c-sugg button small{color:#7d8896;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-priv{font-size:12px;color:#8fe0a0;white-space:nowrap}
.c-body{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:calc(100vh - 200px);align-content:start}
.c-rail{display:flex;flex-direction:column;gap:4px;padding:10px 8px;border-right:1px solid #222933;background:#0b0e12}
.c-rail button{border:0;background:transparent;color:#8794a3;border-radius:8px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;position:relative}
.c-rail button .g{font-size:17px;line-height:1}
.c-rail button.on{background:#1b2430;color:#7cc4ff}
.c-rail button .c{position:absolute;top:3px;right:6px;font-size:9.5px;background:#e5484d;color:#ffffff;border-radius:8px;padding:0 4px}
.c-rail .note{font-size:9.5px;color:#5f6b7a;text-align:center;padding:4px 2px}
.c-ed{min-width:0;display:flex;flex-direction:column}
.c-tabs{display:flex;gap:0;overflow-x:auto;background:#0b0e12;border-bottom:1px solid #222933}
.c-tabs button{border:0;border-right:1px solid #222933;background:transparent;color:#8794a3;padding:8px 12px;font:12.5px ui-monospace,Menlo,monospace;white-space:nowrap}
.c-tabs button.on{background:#0f1216;color:#d6dde6;box-shadow:inset 0 2px #7cc4ff}
.c-tabs button .n{font-size:10px;color:#ff9a9e;margin-left:5px}
.c-tabs .add{color:#7cc4ff}
.c-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid #222933;background:#121820;font-size:12.5px}
.c-strip .sp{flex:1}
.c-strip .tn{font-weight:700;color:#7cc4ff;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.c-code{flex:1;overflow:auto;max-height:58vh}
.c-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c-split>div{min-width:0;border-right:1px solid #222933}
.c-split h5{margin:0;padding:6px 12px;font:12px ui-monospace,Menlo,monospace;color:#8794a3;border-bottom:1px solid #222933}
.c-panel{border-top:1px solid #2a313b;background:#0b0e12;padding:10px 12px;max-height:40vh;overflow:auto}
.c-panel .grp{margin-top:6px}
.lens{margin:2px 12px 6px 48px;padding:5px 8px;border-left:2px solid #e5484d;background:rgba(229,72,77,.08);font:12px system-ui,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-radius:0 6px 6px 0}
.lens.s2{border-color:#e29a12;background:rgba(226,154,18,.08)}
.lens.s4{border-color:#5f6b7a;background:rgba(95,107,122,.1)}
.lens .m{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.lens button{border:1px solid #2f7d4a;background:#183424;color:#8fe0a0;border-radius:5px;padding:2px 8px;font-size:11.5px}
.c-plist .pi{background:#121820;padding:6px 9px;margin-bottom:5px}
.c-status{display:flex;gap:14px;flex-wrap:wrap;padding:6px 16px;background:#0b0e12;border-top:1px solid #222933;font:11.5px ui-monospace,Menlo,monospace;color:#7d8896}
.c-status .ok{color:#8fe0a0}
.vC .ibtn:not(.pri),.vC .isel{background:#161b22}
.vC .fbtn{background:#2f7d4a}
.vC .ita{background:#0f1216;min-height:50vh;border:0;margin:0;width:100%;border-radius:0}

@media (max-width:760px){
  .a-hd{padding:10px 16px}
  .a-tabs{padding:0 8px}
  .a-tab{flex-direction:column;gap:2px;padding:9px 2px 8px;font-size:11.5px}
  .a-tab .c{font-size:9.5px;padding:0 5px}
  .a-note{padding:6px 16px 0}
  .a-main{grid-template-columns:minmax(0,1fr);padding:12px 16px}
  .a-scroll{max-height:none}
  .a-in .a-scroll{max-height:40vh}
  .a-ft{padding:0 16px}
  .det{grid-template-columns:minmax(0,1fr)}
  .b-wrap{padding:18px 16px 0}
  .b-hd h1{font-size:25px}
  .b-tiles{grid-template-columns:minmax(0,1fr);gap:10px}
  .b-tile .job{min-height:0}
  .b-ws-bar,.b-inbar,.b-tool,.b-inbox{padding-left:16px;padding-right:16px}
  .b-seg button{padding:5px 9px;font-size:12.5px}
  .b-cols{grid-template-columns:minmax(0,1fr)}
  .b-cat{grid-template-columns:minmax(0,1fr)}
  .b-ftab td.ln2{display:none}
  .c-top{flex-wrap:wrap;padding:10px 16px}
  .c-cmd{order:3;flex-basis:100%}
  .c-body{grid-template-columns:minmax(0,1fr);min-height:0}
  .c-rail button.on{align-self:start}
  .c-rail{flex-direction:row;border-right:0;border-bottom:1px solid #222933;padding:6px 8px}
  .c-rail button{flex:1}
  .c-rail .note{display:none}
  .c-split{grid-template-columns:minmax(0,1fr)}
  .c-code{max-height:none}
  .lens{margin-left:16px}
  .ln .no{flex-basis:30px;padding-right:7px}
}

  if(added.length)notes.push("declared "+added.join(", ")+" (well-known namespace)");if(unified&&!isQ)notes.push(`unified ${unified} declaration${unified>1?"s":""} to ${style}`);notes.push("sorted and aligned");

const CONV=[["turtle","Turtle"],["trig","TriG"],["ntriples","N-Triples"],["nquads","N-Quads"]];
const OPS=[["expand","Expand prefixed names"],["shorten","Shorten IRIs"],["organise","Organise prefixes"]];
const EXT={turtle:".ttl",trig:".trig",ntriples:".nt",nquads:".nq"};
function convert(f,op){
  if(op==="organise"){const r=organise(f);return {out:r.text,lang:f.lang,notes:r.notes}}
  if(f.lang==="sparql")return {err:"Queries are not RDF data: only Organise prefixes applies to a .rq file."};
  let R;try{R=parseRDF(f.text)}catch(e){return {err:"Can't convert "+f.name+": "+e.message+"."}}
  const named=R.quads.filter(q=>q.g).length,graphs=new Set(R.quads.filter(q=>q.g).map(q=>q.g.v)).size;const notes=[];
  const P=Object.assign({},WK,R.pre);const kw=/^\s*PREFIX/m.test(f.text);
  if(op==="ntriples"||op==="turtle"){if(named)notes.push(`${named} triple${named>1?"s":""} in ${graphs} named graph${graphs>1?"s":""} ${op==="turtle"?"can't be written in Turtle and were left out":"lost their graph name (N-Triples has no graphs)"}. Use TriG or N-Quads to keep them.`)}
  if(op==="ntriples")return {out:op==="ntriples"&&named?toNT({quads:R.quads}):toNT(R),lang:"ntriples",notes,n:R.quads.length};
  if(op==="nquads")return {out:toNT(R,true),lang:"nquads",notes,n:R.quads.length};
  if(op==="turtle")return {out:toTTL({quads:R.quads.filter(q=>!q.g)},P,false,false),lang:"turtle",notes,n:R.quads.length-named};
  if(op==="trig"){if(!named)notes.push("No named graphs: a Turtle file is already valid TriG, so the text barely changes.");return {out:toTTL(R,P,true,true),lang:"trig",notes,n:R.quads.length}}
  if(op==="expand"){const n=[...f.text.matchAll(/(?:^|[\s;,(\[{])(?:[A-Za-z][\w-]*)?:[\w-]+/g)].length;notes.push(`${n} prefixed names written out as full IRIs; prefix declarations dropped.`);
    return {out:toTTL(R,null,!!named,false),lang:f.lang==="trig"||named?"trig":"turtle",notes,n:R.quads.length}}
  if(op==="shorten"){const full=[...f.text.replace(/^\s*(@prefix|PREFIX)[^\n]*$/gmi,"").matchAll(/<[^<>\s]*>/g)].length;
    notes.push(full?`${full} full IRIs shortened with declared and well-known prefixes.`:"No full IRIs to shorten here. Try it on N-Triples: convert, then “Add to input”, then Shorten.");
    return {out:toTTL(R,P,!!named,false),lang:named?"trig":"turtle",notes,n:R.quads.length}}
  return {err:"Pick a target format."}
}

/* ------------------------------ SHACL model ------------------------------ */
function shGroups(){const G=[];const F=S.files;
  const shapesFile=files().find(f=>/ex:PersonShape/.test(f.text));const dataFile=files().find(f=>/a ex:Person\b/.test(f.text));
  if(shapesFile)G.push({name:"ex:PersonShape",target:"ex:Person",shapes:shapesFile.name,data:dataFile?dataFile.name:null,
    cons:[{path:"ex:name",kw:"sh:minCount",label:"minCount 1"},{path:"ex:name",kw:"sh:maxCount",label:"maxCount 1"},{path:"ex:name",kw:"sh:datatype",label:"datatype xsd:string"},
          {path:"ex:age",kw:"sh:datatype",label:"datatype xsd:integer"},{path:"ex:age",kw:"sh:minInclusive",label:"minInclusive 0"}]});
  const m=files().find(f=>/ex:PumpShape/.test(f.text));
  if(m)G.push({name:"ex:PumpShape",target:"ex:Pump",shapes:m.name,data:m.name,
    cons:[{path:"ex:flowRate",kw:"sh:minCount",label:"minCount 1"},{path:"ex:flowRate",kw:"sh:maxCount",label:"maxCount 1"},{path:"ex:flowRate",kw:"sh:datatype",label:"datatype xsd:decimal"},
          {path:"^ex:partOf",kw:"sh:minCount",label:"minCount 1"},{path:null,kw:"sh:or",label:"or ( class ex:A | class ex:B )"}]});
  G.forEach(g=>{const d=g.data&&F[g.data];g.focus=[];if(d){const re=new RegExp("^(\\S+)\\s+a\\s+"+g.target.replace(":","\\:")+"\\b","gm");let mm;while((mm=re.exec(d.text)))if(!g.focus.includes(mm[1]))g.focus.push(mm[1])}
    g.cells={};if(d)for(const x of live(d).filter(x=>x.code==="shacl-violation")){const c=cellOf(x,g);if(c){(g.cells[c]=g.cells[c]||[]).push(x)}}
    g.viol=Object.values(g.cells).reduce((a,b)=>a+b.length,0)});
  return G}
function cellOf(d,g){const m=d.msg;const focus=((m.match(/^([\w-]*:[\w-]+) \(/)||m.match(/ of ([\w-]*:[\w-]+)/)||[])[1]);
  const path=(m.match(/^(\^?[\w-]*:[\w-]+) of /)||m.match(/\((\^?[\w-]*:[\w-]+) of /)||[])[1]||null;
  const kw=/at least/.test(m)?"sh:minCount":/at most/.test(m)?"sh:maxCount":/not a valid/.test(m)?"sh:datatype":/less than/.test(m)?"sh:minInclusive":/sh:or/.test(m)?"sh:or":null;
  const ci=g.cons.findIndex(c=>c.kw===kw&&(kw==="sh:or"||c.path===path));if(ci<0||!g.focus.includes(focus))return null;return focus+"|"+ci}
function consRange(g,ci){const f=S.files[g.shapes];const c=g.cons[ci];const t=f.text;let i=0;
  if(c.path){const key=c.path.startsWith("^")?"sh:inversePath "+c.path.slice(1):"sh:path "+c.path;i=t.indexOf(key);if(i<0)return null}
  const s=t.indexOf(c.kw,i);if(s<0)return null;let e;if(c.kw==="sh:or")e=t.indexOf(")",s)+1;else{e=s;while(e<t.length&&!/[;\]\n]/.test(t[e]))e++;while(t[e-1]===" ")e--}
  return {s,e}}
function cellVal(g,x){const f=S.files[g.data];const v=f.text.slice(x.s,x.e);return /at least/.test(x.msg)?"none":/at most/.test(x.msg)?"too many":/sh:or/.test(x.msg)?"no match":v}

/* --------------------------- shared tool bodies --------------------------- */
const MK=t=>`<span class="mock">${t||"MOCKED"}</span>`, RL=t=>`<span class="real">${t||"turtle-lsp output"}</span>`;
function lineRange(f,d,pad){const a=lc(f.text,d.s).line;return {from:Math.max(0,a-pad),to:a+pad}}
function itemHTML(f,d,o={}){const p=lc(f.text,d.s);const followers=f.diags.filter(x=>x.follow===d.id&&!x.resolved);
  const fx=FIXES[d.id]||[];let h=`<div class="pi s${d.sev}${S.hot===d.id?" hot":""}"><div class="pi-h"><span class="sev s${d.sev}">${sevName(d.sev)}</span>${o.file?`<span class="code">${esc(f.name)}</span>`:""}<span class="pos">${p.line+1}:${p.col+1}</span><span class="code">${esc(d.code)}</span></div>
  <div class="pi-m" data-act="focusd" data-arg="${esc(d.id)}">${esc(d.msg)}</div>`;
  if(o.excerpt){const r=lineRange(f,d,0);h+=`<div class="box" style="margin-top:6px">${srcHTML(f.text,{marks:marksFor(f,"all"),from:r.from,to:r.to,hot:d.id})}</div>`}
  if(followers.length)h+=`<details><summary>+${followers.length} follow-on error${followers.length>1?"s":""} on the same IRI, fixed with it</summary>${followers.map(x=>`<div>${lc(f.text,x.s).col+1}: ${esc(x.msg)}</div>`).join("")}</details>`;
  if(o.nofixes){}else if(fx.length)fx.forEach((x,k)=>{h+=`<div class="fx"><div class="fx-h">${esc(x.t)}<span class="sp"></span>${MK("MOCKED edit")}<button class="fbtn" data-act="fix" data-arg="${esc(d.id)}|${k}">Apply</button></div>${o.nopreview?"":fixPreview(f,d,x)}</div>`});
  else if(d.code!=="shacl-violation")h+=`<div class="nofix">No automatic fix for this one.</div>`;
  return h+`</div>`}
function notChecked(f){return `<div class="row"><b class="mono">${esc(f.name)}</b><span class="sp"></span><span class="stat">${f.edited?"edited":"added"}: not checked. The prototype embeds turtle-lsp output for the samples only; the WebAssembly build checks every keystroke here.</span></div>`}

function fmtTarget(){const f=cur();return f}
function fmtBody(v,f){f=f||cur();const L=LANGNAME[f.lang];

  const st=diffStats(f.orig,f.formatted),same=f.formatted===f.orig;const kind=f.lang==="sparql"?"Same SPARQL algebra":f.lang==="trig"||f.lang==="nquads"?"Same dataset":"Same graph";
  const changed=f.text!==f.orig;
  let h=`<div class="tsec"><div class="thd">${langs}</div><div class="thd"><span class="guar">✓ ${kind}</span><span class="stat">${same?"Already tidy":`<b class="p">+${st.add}</b> <b class="m">−${st.del}</b> lines`}</span>${f.mock?MK("MOCKED sample"):RL()}<span class="sp"></span>
    <span class="seg"><button class="${S.fmtView==="diff"?"on":""}" data-act="fmtv" data-arg="diff">Diff</button><button class="${S.fmtView==="out"?"on":""}" data-act="fmtv" data-arg="out">Result</button></span>
    <button class="ibtn" data-act="copy" data-arg="fmt">Copy</button><button class="ibtn" disabled title="Downloads are blocked in this preview">Download ${MK()}</button></div>
    <p class="why">${f.lang==="sparql"?"The formatter only changes layout and keyword case: the parsed query, its algebra, is the same before and after.":"The formatter only changes layout: the triples it parses before and after are the same set, and comments stay where they were."}</p>`;
  if(changed)h+=`<div class="warnl">Input changed since the captured run (fixes or edits). This is the formatter's output for the original sample: the prototype can't re-run turtle-lsp.</div>`;

function valBody(v){const c=counts();let h=`<div class="tsec"><div class="thd"><b>${c.val} problem${c.val!==1?"s":""}</b><span class="stat">in ${c.valFiles} file${c.valFiles!==1?"s":""}, found in one pass</span>${RL()}<span class="sp"></span>${c.fixes?`<button class="ibtn pri" data-act="fixall" data-arg="rdf">Apply all ${c.fixes} fixes</button>${MK("MOCKED edits")}`:""}</div>`;

function shBody(v){const G=shGroups();if(!G.length)return `<div class="empty">No shapes in the input.</div>`;const g=G[Math.min(S.shGroup,G.length-1)];
  let h=`<div class="tsec"><div class="thd">${G.length>1?`<span class="seg">${G.map((x,i)=>`<button class="${x===g?"on":""}" data-act="shg" data-arg="${i}">${esc(x.name)}</button>`).join("")}</span>`:`<b class="mono">${esc(g.name)}</b>`}
   <span class="stat">${g.data?`data <b class="mono">${esc(g.data)}</b> × shapes <b class="mono">${esc(g.shapes)}</b>`:"no data file with "+esc(g.target)+" instances"}</span><span class="sp"></span>${RL()}</div>`;
  if(!g.data||!g.focus.length)return h+`<div class="empty">No focus nodes: nothing in the input is a ${esc(g.target)}.</div></div>`;
  h+=`<div class="stat" style="margin-bottom:8px">${g.focus.length} focus node${g.focus.length>1?"s":""} × ${g.cons.length} constraints · <b class="m">${g.viol} violation${g.viol!==1?"s":""}</b> · click a cell</div>`;
  h+=`<div class="gridwrap"><table class="shg"><tr><th class="fn">focus node</th>${g.cons.map(c=>`<th><span class="pth">${esc(c.path||"node")}</span>${esc(c.label)}</th>`).join("")}</tr>`;
  for(const fn of g.focus){h+=`<tr><td class="fn">${esc(fn)}</td>`;g.cons.forEach((c,ci)=>{const k=fn+"|"+ci,xs=g.cells[k];const sel=S.cell===g.name+"|"+k;
    h+=xs?`<td class="c fail${sel?" sel":""}" data-act="cell" data-arg="${esc(g.name+"|"+k)}">✕<small>${esc(cellVal(g,xs[0]))}</small></td>`:`<td class="c pass${sel?" sel":""}" data-act="cell" data-arg="${esc(g.name+"|"+k)}">✓</td>`});h+=`</tr>`}
  h+=`</table></div>`;
  if(v!=="C")h+=cellDetail(g);
  return h+`<p class="why">turtle-lsp runs SHACL Core and SHACL-SPARQL; violations come back as diagnostics with ranges, so each one points at text.</p></div>`}
function selCell(g){if(!S.cell||!S.cell.startsWith(g.name+"|"))return null;const [,fn,ci]=S.cell.split("|");return {fn,ci:+ci,xs:g.cells[fn+"|"+ci]||[]}}
function cellDetail(g){const c=selCell(g);if(!c)return `<div class="why">Select a cell to see the value in the data and the constraint in the shapes side by side.</div>`;

   <div class="box"><h4>Value in ${esc(g.data)}</h4>${srcHTML(df.text,{marks:c.xs.map(x=>({s:x.s,e:x.e,sev:1,id:x.id})),from:Math.max(0,fl),to:Math.max(0,fl)})}</div>
   <div class="box"><h4>Constraint in ${esc(g.shapes)} ${MK("MOCKED link")}</h4>${srcHTML(sf.text,{marks:cr?[{s:cr.s,e:cr.e,cls:"cons"}]:[],from:sl,to:sl})}</div></div>`}

function VA(){const c=counts();const T=TOOLS.filter(t=>toolOk(t.id));

function commands(){const L=[];TOOLS.forEach(t=>{if(toolOk(t.id))L.push({l:t.name,d:t.job,run:()=>setTool(t.id)})});
  CONV.forEach(([k,n])=>L.push({l:"Convert to "+n,d:"current file → "+n,run:()=>{setTool("convert");S.conv=k}}));
  OPS.forEach(([k,n])=>L.push({l:n,d:"Convert tool",run:()=>{setTool("convert");S.conv=k}}));
  L.push({l:"Apply all fixes",d:"every one-click fix in the input (MOCKED edits)",run:()=>{setTool("validate");applyAll(isRdf)}});
  L.push({l:"Copy formatted text",d:"Format tool",run:()=>{setTool("format");copy("fmt")}});
  S.order.forEach(n=>L.push({l:"Open "+n,d:"switch file",run:()=>{S.file=n}}));
  Object.entries(SETS).forEach(([k,s])=>L.push({l:"Load sample: "+s.label,d:"replaces the input",run:()=>loadSet(k)}));
  L.push({l:"Paste text",d:"new file",run:()=>{S.paste=true}});return L}
function cmdMatches(q){const L=commands();if(!q.trim())return L.slice(0,8);const w=q.toLowerCase().split(/\s+/).filter(Boolean);
  return L.filter(c=>w.every(x=>(c.l+" "+c.d).toLowerCase().includes(x))).slice(0,8)}
function drawSugg(){const box=document.getElementById("sugg"),inp=document.getElementById("cmd");if(!box||!inp)return;
  if(document.activeElement!==inp){box.hidden=true;return}const M=cmdMatches(S.cmd);S.cmdSel=Math.min(S.cmdSel,Math.max(0,M.length-1));
  box.hidden=false;box.innerHTML=M.length?M.map((c,i)=>`<button class="${i===S.cmdSel?"sel":""}" data-cmd="${i}"><span>${esc(c.l)}</span><small>${esc(c.d)}</small></button>`).join(""):`<button><small>No command matches</small></button>`}
function runCmd(i){const M=cmdMatches(S.cmd);const c=M[i];if(!c)return;S.cmd="";S.cmdSel=0;c.run();render()}

function setTool(t){if(!toolOk(t))return;S.tool=t;S.hot=null;S.paste=false;S.edit=false;const f=cur();
  if(t==="sparql"&&f&&f.lang!=="sparql"){const q=files().find(x=>x.lang==="sparql");if(q)S.file=q.name}
  if((t==="validate"||t==="convert")&&f&&f.lang==="sparql"&&t==="validate"){const r=files().find(isRdf);if(r)S.file=r.name}
  if(t==="shacl"){const G=shGroups();const g=G[Math.min(S.shGroup,G.length-1)];if(g&&g.data)S.file=g.data}
  if(t==="convert"&&f&&f.lang==="sparql"){const r=files().find(isRdf);if(r)S.file=r.name}}

  if(kind==="fmt"){const g=S.tool==="sparql"?sqFile():f;txt=g&&g.formatted||""}else{const r=f&&convert(f,S.conv);txt=r&&r.out||""}
  if(!txt){toast("Nothing to copy");return}
  try{navigator.clipboard.writeText(txt).then(()=>toast("Copied "+txt.split("\n").length+" lines"),()=>toast("Clipboard blocked here: select the text instead"))}catch(e){toast("Clipboard blocked here: select the text instead")}}
let toastT=null;function toast(m){S.toast=m;const el=document.getElementById("toast");if(el){el.textContent=m;el.hidden=false}clearTimeout(toastT);toastT=setTimeout(()=>{const e=document.getElementById("toast");if(e)e.hidden=true},2200)}
function addTexts(list){let last=null;for(const {name,text} of list){last=addFile(mkFile(name,{text,diags:null,formatted:null},false,false))}if(last){S.file=last;S.paste=false;toast(list.length+" file"+(list.length>1?"s":"")+" added (read in this tab)")}render()}
async function readEntry(en,out){if(en.isFile){await new Promise(r=>en.file(f=>{out.push(f);r()},()=>r()))}else if(en.isDirectory){const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r,()=>r([])));for(const e of b)await readEntry(e,out)}while(b.length)}}
async function takeFiles(fs){const ok=[...fs].filter(f=>/\.(ttl|trig|nt|nq|rq|sparql|ru)$/i.test(f.name));if(!ok.length){toast("No .ttl/.trig/.nt/.nq/.rq files found");return}
  const list=await Promise.all(ok.map(f=>f.text().then(text=>({name:f.name,text}))));addTexts(list)}

function act(a,arg,el){
  switch(a){
    case "tool":setTool(arg);if(S.v==="B")S.home=false;break;
    case "open":setTool(arg);S.home=false;window.scrollTo(0,0);break;
    case "home":S.home=true;window.scrollTo(0,0);break;
    case "file":S.file=arg;S.cell=null;S.hot=null;S.edit=false;S.paste=false;break;
    case "rm":{delete S.files[arg];S.order=S.order.filter(n=>n!==arg);if(S.file===arg)S.file=S.order[0];if(!toolOk(S.tool))S.tool="validate";break}
    case "set":if(arg)loadSet(arg);else return;break;
    case "paste":S.paste=!S.paste;S.edit=false;if(S.v==="B"&&!S.home)S.inputOpen=true;break;
    case "pasteadd":{const ta=document.getElementById("pasteta");const t=ta&&ta.value.trim();if(!t){toast("Paste something first");return}
      const lang=langOf("",t);addTexts([{name:"pasted-"+(S.pasteN++)+(lang==="sparql"?".rq":lang==="trig"?".trig":".ttl"),text:t+"\n"}]);return}
    case "pick":document.getElementById("fpick").click();return;
    case "pickdir":document.getElementById("dpick").click();return;
    case "edit":S.edit=!S.edit;S.paste=false;if(S.v==="B"&&!S.home)S.inputOpen=true;break;
    case "revert":{const f=cur();f.text=f.orig;f.edited=false;f.diags.forEach(d=>{d.resolved=false});const src=REAL[f.name]||MOCK_FILES[f.name];if(src){Object.assign(f,mkFile(f.name,src,f.mock,f.engine));computeFollow()}break}
    case "fix":{const [id,k]=arg.split("|");applyFix(id,+k);break}
    case "fixall":applyAll(arg==="rdf"?isRdf:f=>f.name===arg);break;
    case "focusd":case "hot":{const fn=arg.split("#")[0];S.file=fn;S.hot=arg;break}
    case "cell":S.cell=arg;break;
    case "shg":S.shGroup=+arg;S.cell=null;{const g=shGroups()[+arg];if(g&&g.data)S.file=g.data}break;
    case "fmtv":S.fmtView=arg;break;
    case "fmtall":{const F=files().filter(f=>f.formatted!=null);if(!F.length)return;const i=F.indexOf(cur());S.file=F[(i+1)%F.length].name;break}
    case "sqv":S.sqView=arg;break;
    case "conv":S.conv=arg;break;
    case "cvsrcv":S.cvShowSrc=arg==="1";break;
    case "copy":copy(arg);return;
    case "addout":{const f=cur();const r=convert(f,S.conv);if(r.out){addTexts([{name:arg,text:r.out}]);toast("Added "+arg+" to the input")}return}
    case "inopen":S.inputOpen=!S.inputOpen;break;
    default:return}
  render();
  if(a==="focusd"||a==="hot"){const sc=document.getElementById("srcscroll");const m=sc&&sc.querySelector(".mk.hot");if(sc&&m&&sc.scrollHeight>sc.clientHeight)sc.scrollTop=m.offsetTop-sc.offsetTop-sc.clientHeight/2}}

/* ------------------------------- switcher ------------------------------- */
const VNAMES={A:"Tool tabs",B:"Tool home",C:"Command editor"};
const BG={A:["#f4f5f8","#1d2330"],B:["#f7f3ea","#2b2620"],C:["#0f1216","#d6dde6"]};
function readHash(){const h=(location.hash||"").replace("#","").toUpperCase();return ["A","B","C"].includes(h)?h:null}
function setV(v){S.v=v;try{history.replaceState(null,"","#"+v)}catch(e){}render()}
function stateText(){const c=counts();return JSON.stringify({variant:S.v+" ("+VNAMES[S.v]+")",tool:S.tool,file:S.file,sampleSet:S.set,files:S.order.map(n=>{const f=S.files[n];return n+" ["+LANGNAME[f.lang]+(f.engine?"":", no engine output")+(f.edited?", edited":"")+"] live diagnostics: "+live(f).length}),
  shaclToolVisible:hasShapes(),counts:{validate:c.val,shacl:c.sh,sparql:c.sq,formatWouldChange:c.fmt,oneClickFixes:c.fixes},appliedFixes_MOCKED:S.applied,
  convert:S.conv,selectedShaclCell:S.cell,highlightedDiagnostic:S.hot,B_home:S.v==="B"?S.home:undefined},null,2)}
function render(){const app=document.getElementById("app");
  app.innerHTML=(S.v==="A"?VA():S.v==="B"?VB():VC())+
   `<div id="pbar"><button data-sw="-1" aria-label="previous variant">←</button><span class="lbl">${S.v} · ${VNAMES[S.v]}</span><button data-sw="1" aria-label="next variant">→</button><button data-sw="state">state</button></div>`+
   (S.stateOpen?`<pre id="pstate">${esc(stateText())}</pre>`:"")+`<div id="toast" hidden></div>`;
  document.body.style.background=BG[S.v][0];document.body.style.color=BG[S.v][1];document.body.style.margin="0";
  const et=document.getElementById("editta");if(et)et.addEventListener("input",()=>{const f=cur();f.text=et.value;f.edited=f.text!==f.orig});
  const ci=document.getElementById("cmd");if(ci){ci.addEventListener("input",()=>{S.cmd=ci.value;S.cmdSel=0;drawSugg()});ci.addEventListener("focus",drawSugg);ci.addEventListener("blur",()=>setTimeout(drawSugg,150));
    ci.addEventListener("keydown",e=>{const M=cmdMatches(S.cmd);if(e.key==="ArrowDown"){S.cmdSel=Math.min(M.length-1,S.cmdSel+1);drawSugg();e.preventDefault()}else if(e.key==="ArrowUp"){S.cmdSel=Math.max(0,S.cmdSel-1);drawSugg();e.preventDefault()}else if(e.key==="Enter"){runCmd(S.cmdSel);e.preventDefault()}else if(e.key==="Escape"){ci.blur()}})}
  if(S.paste){const p=document.getElementById("pasteta");if(p)p.focus()}}

document.addEventListener("click",e=>{const sw=e.target.closest("[data-sw]");if(sw){const k=sw.getAttribute("data-sw");if(k==="state"){S.stateOpen=!S.stateOpen;render();return}
    const V=["A","B","C"];setV(V[(V.indexOf(S.v)+(+k)+3)%3]);return}
  const cm=e.target.closest("[data-cmd]");if(cm){runCmd(+cm.getAttribute("data-cmd"));return}
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT")return;act(el.getAttribute("data-act"),el.getAttribute("data-arg"),el)});
document.addEventListener("change",e=>{const el=e.target;if(el.matches&&el.matches("select[data-act]")){const a=el.getAttribute("data-act");
  if(a==="set")loadSet(el.value);else if(a==="cvsrc")S.file=el.value;render()}
  if(el.id==="fpick"||el.id==="dpick"){takeFiles(el.files);el.value=""}});
document.addEventListener("keydown",e=>{const t=e.target;const typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable);if(typing)return;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const V=["A","B","C"];setV(V[(V.indexOf(S.v)+(e.key==="ArrowRight"?1:2))%3])}
  else if(e.key==="/"&&S.v==="C"){const c=document.getElementById("cmd");if(c){c.focus();e.preventDefault()}}});
document.addEventListener("dragover",e=>{e.preventDefault()});
document.addEventListener("drop",async e=>{e.preventDefault();const items=e.dataTransfer&&e.dataTransfer.items;const out=[];
  if(items&&items.length&&items[0].webkitGetAsEntry){const ens=[...items].map(i=>i.webkitGetAsEntry()).filter(Boolean);for(const en of ens)await readEntry(en,out)}else if(e.dataTransfer)out.push(...e.dataTransfer.files);takeFiles(out)});
window.addEventListener("hashchange",()=>{const h=readHash();if(h&&h!==S.v){S.v=h;render()}});

loadSet("all");S.v=readHash()||"A";render();
</script>
</body>
