[package]
name = "turtle-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
line-index = "0.1.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
oxilangtag = "0.1.6"
oxiri = "0.3.1"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[dev-dependencies]
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxttl = { version = "0.2.4", features = ["rdf-12"] }
