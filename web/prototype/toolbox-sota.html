<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: "what should a state-of-the-art, browser-only
  RDF toolbox built on turtle-lsp look like?" Designed from
  docs/research/web-rdf-tools.md, section (c): every problem at once, fixes
  rather than findings, SHACL results on the source, trustworthy formatting.

  Three structurally different variants, switchable with ?variant=A|B|C, the
  pink bar at the bottom, or the left/right arrow keys:
    A  Review     - the file as a code review: problems inline, fixes as diffs
    B  Shapes grid - SHACL as a focus-node x constraint grid, linked to both files
    C  Pipeline   - check, fix, validate, format, convert as a chain of steps

  Diagnostics and formatting are REAL turtle-lsp output for the sample files,
  embedded below (no WebAssembly yet). Quick-fix edits, conversion output and
  query results are written by the prototype and labelled MOCKED where shown.
  Self-contained: no external scripts, fonts or network. Open the file directly.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDF toolbox prototype</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 84px; overflow-x: hidden; }
  .mono, pre, code, .src { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  button { font: inherit; cursor: pointer; }
  .mock { display: inline-block; font: 600 10px/1 system-ui; letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: #fde68a; color: #78350f; vertical-align: middle; }
  .real { display: inline-block; font: 600 10px/1 system-ui; letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: #bbf7d0; color: #14532d; vertical-align: middle; }

  /* ---------- switcher (not part of the design) ---------- */
  #pbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; align-items: center; gap: 4px; background: #ff3d7f; color: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); font: 600 13px system-ui; white-space: nowrap; }
  #pbar button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 999px; min-width: 34px; height: 34px; padding: 0 10px; }
  #pbar #vlabel { padding: 0 8px; }
  #pstate { position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%); z-index: 1000; width: min(520px, calc(100vw - 32px)); max-height: 40vh; overflow: auto; background: #111; color: #a7f3d0; font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 10px; border-radius: 10px; margin: 0; white-space: pre-wrap; }

  /* ---------- shared source view ---------- */
  .src { font-size: 12.5px; line-height: 20px; }
  .ln { display: flex; }
  .ln .no { flex: 0 0 34px; text-align: right; padding-right: 10px; color: #9ca3af; user-select: none; }
  .ln .tx { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  mark { background: none; color: inherit; border-bottom: 2px wavy; }
  mark.s1 { border-color: #dc2626; background: rgba(220,38,38,.10); }
  mark.s2 { border-color: #d97706; background: rgba(217,119,6,.10); }
  mark.s4 { border-color: #9ca3af; border-bottom-style: dotted; }
  mark.fixed { border: 0; background: rgba(22,163,74,.18); }

  /* =========================== A: Review =========================== */
  .A { background: #f6f8fa; color: #1f2328; min-height: 100vh; }
  .A header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; background: #fff; border-bottom: 1px solid #d0d7de; }
  .A header b { font-size: 16px; }
  .A .priv { font-size: 12px; color: #1a7f37; }
  .A .files { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
  .A .files button { border: 1px solid #d0d7de; background: #fff; border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  .A .files button.on { border-color: #0969da; box-shadow: inset 0 -2px #0969da; font-weight: 600; }
  .A .files .n { margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #ffebe9; color: #cf222e; }
  .A .files .n.ok { background: #dafbe1; color: #1a7f37; }
  .A .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 12px 20px; max-width: 1280px; }
  .A .doc { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden; min-width: 0; }
  .A .dochd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; background: #f6f8fa; border-bottom: 1px solid #d0d7de; font-size: 13px; }
  .A .dochd .sp { flex: 1; }
  .A .chip { border: 1px solid #d0d7de; background: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .A .chip.off { opacity: .45; text-decoration: line-through; }
  .A .src { padding: 8px 0; }
  .A .ln.add { background: #dafbe1; } .A .ln.add .no::before { content: "+"; color: #1a7f37; }
  .A .ln.del .tx { text-decoration: line-through; color: #8c959f; background: #ffebe9; }
  .A .card { margin: 4px 12px 8px 44px; border: 1px solid #d0d7de; border-left: 4px solid #cf222e; border-radius: 6px; background: #fff; font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.4; }
  .A .card.s2 { border-left-color: #bf8700; } .A .card.s4 { border-left-color: #8c959f; }
  .A .card.done { border-left-color: #1a7f37; opacity: .75; }
  .A .card .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 8px 10px; }
  .A .card .cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #57606a; }
  .A .card .follow { padding: 0 10px 8px; font-size: 12px; color: #57606a; }
  .A .diff { margin: 0 10px 8px; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden; font-size: 12px; }
  .A .diff div { padding: 2px 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; }
  .A .diff .m { background: #ffebe9; } .A .diff .p { background: #dafbe1; }
  .A .diff .bar { display: flex; gap: 8px; align-items: center; background: #f6f8fa; font-family: system-ui; }
  .A .btn { border: 1px solid #1f883d; background: #1f883d; color: #fff; border-radius: 6px; padding: 3px 10px; font-size: 12px; }
  .A .btn.ghost { background: #fff; color: #1f2328; border-color: #d0d7de; }
  .A aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .A .panel { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; font-size: 13px; }
  .A .panel h4 { margin: 0 0 8px; font-size: 13px; }
  .A .panel .big { font-size: 28px; font-weight: 700; line-height: 1; }
  .A .panel ul { margin: 6px 0 0; padding-left: 18px; }
  .A .fmtdiff { max-height: 360px; overflow: auto; border: 1px solid #d0d7de; border-radius: 6px; font-size: 11.5px; line-height: 17px; margin-top: 8px; }
  .A .fmtdiff div { white-space: pre-wrap; padding: 0 6px; font-family: ui-monospace, Menlo, monospace; }
  .A .fmtdiff .m { background: #ffebe9; } .A .fmtdiff .p { background: #dafbe1; }
  @media (max-width: 900px) {
    .A .wrap { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
    .A .why { display: none; }
    .A .ph { display: inline-block !important; }
    .A header, .A .files { padding-left: 16px; padding-right: 16px; }
    .A .card { margin-left: 12px; }
  }

  /* =========================== B: Shapes grid =========================== */
  .B { background: #0f1115; color: #e6e8eb; min-height: 100vh; }
  .B .top { padding: 22px 24px 8px; max-width: 1200px; margin: 0 auto; }
  .B .eyebrow { font-size: 12px; color: #8b93a1; letter-spacing: .05em; text-transform: uppercase; }
  .B h1 { font-size: 26px; margin: 6px 0 4px; font-weight: 650; }
  .B h1 em { font-style: normal; color: #ff6b6b; }
  .B .sub { color: #a3abb8; font-size: 13px; }
  .B .inputs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .B .inputs span { border: 1px solid #2a2f3a; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #cfd5de; background: #161a21; }
  .B .main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; padding: 12px 24px; max-width: 1200px; margin: 0 auto; }
  .B table { border-collapse: separate; border-spacing: 4px; width: 100%; }
  .B th { font-weight: 500; font-size: 11.5px; color: #a3abb8; text-align: center; vertical-align: bottom; padding: 4px; }
  .B th .p { display: block; color: #e6e8eb; font-family: ui-monospace, Menlo, monospace; }
  .B td.node { font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding-right: 8px; white-space: nowrap; }
  .B td.node small { display: block; color: #8b93a1; font-family: system-ui; font-size: 11px; }
  .B .cell { width: 100%; height: 46px; border: 1px solid transparent; border-radius: 6px; font-size: 18px; font-weight: 700; color: #0f1115; }
  .B .cell.pass { background: #1f3b2d; color: #6ee7a8; }
  .B .cell.fail { background: #5b1d22; color: #ffb4b4; }
  .B .cell.sel { outline: 2px solid #fff; outline-offset: 1px; }
  .B .legend { font-size: 12px; color: #8b93a1; margin-top: 6px; }
  .B .detail { background: #161a21; border: 1px solid #2a2f3a; border-radius: 10px; padding: 14px; min-width: 0; }
  .B .detail h3 { margin: 0 0 4px; font-size: 15px; }
  .B .detail .msg { font-size: 13px; color: #ffb4b4; margin: 6px 0; }
  .B .detail .msg.ok { color: #6ee7a8; }
  .B .excerpt { margin-top: 12px; }
  .B .excerpt .lbl { font-size: 11px; color: #8b93a1; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .B .excerpt .src { background: #0b0d11; border: 1px solid #2a2f3a; border-radius: 6px; padding: 6px 0; color: #cfd5de; }
  .B .ln .no { color: #4b5361; }
  .B .ln.hot { background: rgba(255,255,255,.04); }
  .B mark.s1 { background: rgba(255,107,107,.18); border-color: #ff6b6b; }
  .B mark.k { background: rgba(122,162,255,.22); border-bottom: 2px solid #7aa2ff; }
  .B .others { max-width: 1200px; margin: 6px auto 0; padding: 0 24px; font-size: 12.5px; color: #a3abb8; }
  .B .others b { color: #e6e8eb; }
  .B .cards { display: none; }
  .B .ncard { background: #161a21; border: 1px solid #2a2f3a; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .B .ncard .hd { padding: 10px 12px; font-family: ui-monospace, Menlo, monospace; display: flex; justify-content: space-between; }
  .B .ncard button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; background: none; border: 0; border-top: 1px solid #2a2f3a; color: #cfd5de; padding: 9px 12px; font-size: 13px; }
  .B .ncard button .st { width: 22px; font-weight: 700; } .B .ncard .pass .st { color: #6ee7a8; } .B .ncard .fail .st { color: #ff8a8a; }
  .B .ncard button.sel { background: #222833; }
  @media (max-width: 860px) {
    .B .main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
    .B .top, .B .others { padding-left: 16px; padding-right: 16px; }
    .B .gridwrap { display: none; } .B .cards { display: block; }
    .B h1 { font-size: 21px; }
  }

  /* =========================== C: Pipeline =========================== */
  .C { background: #f4efe6; color: #2b2620; min-height: 100vh; }
  .C .col { max-width: 860px; margin: 0 auto; padding: 24px 20px; }
  .C h1 { font: 700 28px/1.15 Georgia, "Times New Roman", serif; margin: 0 0 6px; }
  .C .lede { color: #6b5f50; margin: 0 0 16px; }
  .C .pick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .C .pick button { border: 1px solid #cbbfae; background: #fffaf2; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .C .pick button.on { background: #2b2620; color: #fffaf2; border-color: #2b2620; }
  .C .step { position: relative; padding-left: 44px; padding-bottom: 14px; }
  .C .step::before { content: ""; position: absolute; left: 15px; top: 30px; bottom: 0; width: 2px; background: #d8ccba; }
  .C .step:last-child::before { display: none; }
  .C .dot { position: absolute; left: 0; top: 4px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid; background: #fffaf2; }
  .C .dot.done { border-color: #2f7d4f; color: #2f7d4f; }
  .C .dot.issues { border-color: #b4462f; color: #b4462f; }
  .C .dot.blocked { border-color: #a39684; color: #a39684; border-style: dashed; }
  .C .dot.skip { border-color: #cbbfae; color: #cbbfae; }
  .C .dot.mock { border-color: #b7791f; color: #b7791f; }
  .C .box { background: #fffaf2; border: 1px solid #e0d5c4; border-radius: 10px; overflow: hidden; }
  .C .box .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; cursor: pointer; }
  .C .box .hd h3 { margin: 0; font-size: 15px; }
  .C .box .hd .st { font-size: 12.5px; color: #6b5f50; }
  .C .box .hd .sp { flex: 1; }
  .C .box .bd { border-top: 1px solid #ece3d5; padding: 12px 14px; font-size: 13px; }
  .C pre { margin: 0; font-size: 12px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere; background: #f8f2e8; border: 1px solid #ece3d5; border-radius: 6px; padding: 8px 10px; max-height: 320px; overflow: auto; }
  .C .row { display: grid; grid-template-columns: 64px 92px minmax(0, 1fr); gap: 8px; padding: 5px 0; border-bottom: 1px dashed #e6dccd; }
  .C .row:last-child { border-bottom: 0; }
  .C .row .where { font-family: ui-monospace, Menlo, monospace; color: #6b5f50; font-size: 12px; }
  .C .sv1 { color: #b4462f; font-weight: 600; } .C .sv2 { color: #9a6a00; font-weight: 600; } .C .sv4 { color: #8a7f70; font-weight: 600; }
  .C .fix { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
  .C .go { background: #2b2620; color: #fffaf2; border: 0; border-radius: 8px; padding: 7px 14px; font-size: 13px; margin-top: 8px; }
  .C .go:disabled { opacity: .4; cursor: default; }
  .C .note { font-size: 12px; color: #8a7f70; margin-top: 8px; }
  .C table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .C td, .C th { border-bottom: 1px solid #ece3d5; padding: 5px 6px; text-align: left; overflow-wrap: anywhere; }
  .C .share { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 12.5px; color: #6b5f50; }
  @media (max-width: 600px) {
    .C .col { padding: 18px 16px; }
    .C h1 { font-size: 23px; }
    .C .step { padding-left: 38px; }
    .C .row { grid-template-columns: 52px minmax(0, 1fr); }
    .C .row .msg { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="pbar"><button id="prev" aria-label="Previous variant">&larr;</button><span id="vlabel"></span><button id="next" aria-label="Next variant">&rarr;</button><button id="stbtn" title="Show prototype state">state</button></div>
<pre id="pstate" hidden></pre>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const CAT = c => c === "syntax" ? "Syntax" : /prefix/.test(c) ? "Prefixes" : c === "unknown-term" ? "Vocabulary" : c.startsWith("shacl") ? "SHACL" : "Query";
const linesOf = t => t.replace(/\n$/, "").split("\n");

// ---------- diagnostics helpers ----------
function diagsOf(f) { return (REAL[f].diags || []).map((d, i) => ({ ...d, id: i, file: f })); }
// Follow-on syntax errors on the same line as an earlier one are grouped under it.
function grouped(f) {
  const ds = diagsOf(f), seen = {}, out = [];
  for (const d of ds) {
    const k = d.line;
    if (d.code === "syntax" && seen[k]) { seen[k].follow.push(d); continue; }
    const g = { ...d, follow: [] }; out.push(g);
    if (d.code === "syntax") seen[k] = g;
  }
  return out.sort((a, b) => a.line - b.line || a.col - b.col);
}
// Quick fixes. The server offers these; the exact edits were not captured, so the
// prototype writes them from the diagnostic. Shown with a MOCKED tag.
function fixFor(d) {
  const lines = linesOf(REAL[d.file].text);
  if (d.code === "undeclared-prefix") {
    const m = d.msg.match(/add ((?:@prefix|PREFIX) ([\w-]*:) [^)]+)\)/);
    if (!m) return null;
    let last = -1; lines.forEach((l, i) => { if (/^\s*(@prefix|PREFIX)/i.test(l)) last = i; });
    return { label: `Declare ${m[2]}`, op: "insertAfter", line: last, text: m[1].startsWith("@") ? m[1] + " ." : m[1] };
  }
  if (d.code === "unknown-term" && /'lable'/.test(d.msg)) return { label: "Change to rdfs:label", op: "replace", line: d.line, col: d.col, endCol: d.endCol, text: "rdfs:label" };
  if (d.code === "unused-prefix") return { label: "Remove unused prefix", op: "delete", line: d.line };
  if (d.code === "unbound-projection") return { label: "Remove ?nick from SELECT", op: "replace", line: d.line, col: d.col - 1, endCol: d.endCol, text: "" };
  if (d.code === "syntax" && /Unterminated IRI/.test(d.msg)) {
    const l = lines[d.line], m = l.slice(d.col).match(/^<[^>]*>/);
    if (m) return { label: "Remove the space inside the IRI", op: "replace", line: d.line, col: d.col, endCol: d.col + m[0].length, text: m[0].replace(/\s+/g, "") };
  }
  return null;
}
// Render text as numbered lines, highlighting the given diagnostics and applying fixes in place.
function srcLines(f, diags, fixes = [], extraMarks = []) {
  const lines = linesOf(REAL[f].text), rows = [];
  const fx = l => fixes.filter(x => x.line === l);
  if (fixes.some(x => x.op === "insertAfter" && x.line === -1)) fixes.filter(x => x.op === "insertAfter" && x.line === -1).forEach(x => rows.push({ no: "", cls: "add", html: esc(x.text), line: -1 }));
  lines.forEach((l, i) => {
    const mine = fx(i), rep = mine.find(x => x.op === "replace"), del = mine.find(x => x.op === "delete");
    let html;
    if (rep) html = esc(l.slice(0, rep.col)) + `<mark class="fixed">${esc(rep.text) || "&#8203;"}</mark>` + esc(l.slice(rep.endCol));
    else {
      const rs = [...diags.filter(d => d.line === i).map(d => ({ col: d.col, end: d.endCol, cls: "s" + d.sev })), ...extraMarks.filter(m => m.line === i).map(m => ({ col: m.col, end: m.endCol, cls: m.cls }))]
        .sort((a, b) => a.col - b.col);
      let pos = 0; html = "";
      for (const r of rs) { if (r.col < pos) continue; html += esc(l.slice(pos, r.col)) + `<mark class="${r.cls}">${esc(l.slice(r.col, Math.max(r.end, r.col + 1)))}</mark>`; pos = Math.max(r.end, r.col + 1); }
      html += esc(l.slice(pos));
    }
    rows.push({ no: i + 1, cls: del ? "del" : "", html, line: i });
    mine.filter(x => x.op === "insertAfter").forEach(x => rows.push({ no: "", cls: "add", html: esc(x.text), line: i }));
  });
  return rows;
}
const rowHTML = r => `<div class="ln ${r.cls}"><span class="no">${r.no}</span><span class="tx">${r.html || " "}</span></div>`;

// Line diff (LCS) for the formatting preview.
function lineDiff(a, b) {
  a = linesOf(a); b = linesOf(b);
  const n = a.length, m = b.length, T = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) T[i][j] = a[i] === b[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push([" ", a[i]]); i++; j++; } else if (T[i + 1][j] >= T[i][j + 1]) out.push(["-", a[i++]]); else out.push(["+", b[j++]]); }
  while (i < n) out.push(["-", a[i++]]); while (j < m) out.push(["+", b[j++]]);
  return out;
}

// =========================== A: Review ===========================
const A_FILES = ["broken.ttl", "query.rq", "data.ttl", "messy.ttl", "messy.rq", "shapes.ttl"];
function VariantA() {
  const f = S.a.file, applied = S.applied[f] || [];
  const gs = grouped(f), shown = gs.filter(g => !S.a.hide.includes(CAT(g.code)));
  const fixes = gs.filter(g => applied.includes(g.id)).map(fixFor).filter(Boolean);
  const live = shown.filter(g => !applied.includes(g.id));
  const markDs = live.flatMap(g => [g, ...g.follow]);
  const rows = srcLines(f, markDs, fixes);
  const byLine = {}; shown.forEach(g => (byLine[g.line] = byLine[g.line] || []).push(g));
  const cats = {}; gs.forEach(g => cats[CAT(g.code)] = (cats[CAT(g.code)] || 0) + 1);
  const open = gs.filter(g => !applied.includes(g.id));
  const fixable = open.filter(g => fixFor(g));
  const card = g => {
    const fx = fixFor(g), done = applied.includes(g.id), src = linesOf(REAL[f].text)[fx?.line] ?? "";
    const diff = fx && !done ? `<div class="diff"><div class="bar"><span class="mock">mocked edit</span><b style="flex:1">${esc(fx.label)}</b><button class="btn" data-apply="${g.id}">Apply</button></div>${
      fx.op === "replace" ? `<div class="m">- ${esc(src)}</div><div class="p">+ ${esc(src.slice(0, fx.col) + fx.text + src.slice(fx.endCol))}</div>`
      : fx.op === "delete" ? `<div class="m">- ${esc(src)}</div>` : `<div class="p">+ ${esc(fx.text)}</div>`}</div>` : "";
    return `<div class="card s${g.sev} ${done ? "done" : ""}"><div class="top"><span class="cat">${done ? "fixed" : SEV[g.sev]} · ${CAT(g.code)}</span><span>${esc(g.msg)}</span><span class="mono" style="color:#57606a;font-size:12px">${g.line + 1}:${g.col + 1} ${esc(g.code)}</span>${done ? `<button class="btn ghost" data-undo="${g.id}">Undo</button>` : ""}</div>${
      g.follow.length && !done ? `<div class="follow">+ ${g.follow.length} follow-on syntax errors on this line, grouped: they go away with this fix.</div>` : ""}${diff}</div>`;
  };
  const body = rows.map(r => rowHTML(r) + (r.cls !== "add" && byLine[r.line] ? byLine[r.line].map(card).join("") : "")).join("");
  const fmt = REAL[f].formatted;
  const fmtPanel = fmt
    ? `<div class="panel"><h4>Formatting <span class="real">real</span></h4>The formatter keeps the ${f.endsWith(".rq") ? "SPARQL algebra" : "graph"} exactly, so this diff changes layout only. ${fmt === REAL[f].text ? "<p>Already formatted.</p>" : `<div style="margin-top:8px"><button class="btn ghost" data-fmt>${S.a.fmt ? "Hide" : "Preview"} formatting diff</button> <button class="btn">Download formatted</button></div>${
        S.a.fmt ? `<div class="fmtdiff">${lineDiff(REAL[f].text, fmt).map(([k, l]) => `<div class="${k === "-" ? "m" : k === "+" ? "p" : ""}">${k} ${esc(l)}</div>`).join("")}</div>` : ""}`}</div>`
    : `<div class="panel"><h4>Formatting</h4>Blocked: the formatter needs a file without syntax errors. Fix ${gs.filter(g => g.code === "syntax").length} syntax problem(s) first.</div>`;
  return `<div class="A"><header><b>RDF toolbox</b><span class="priv">Runs in this tab with WebAssembly. Nothing is uploaded.</span><span style="flex:1"></span><span style="font-size:12px;color:#57606a">turtle-lsp · W3C RDF syntax tests 1137/1137</span></header>
  <div class="files">${A_FILES.map(x => { const n = (REAL[x].diags || []).filter(d => d.sev <= 2).length; return `<button class="${x === f ? "on" : ""}" data-afile="${x}"><span class="mono">${x}</span><span class="n ${n ? "" : "ok"}">${n || "ok"}</span></button>`; }).join("")}</div>
  <div class="wrap"><div class="doc"><div class="dochd"><b class="mono">${f}</b><span>${REAL[f].lang === "sparql" ? "SPARQL" : "Turtle"}${f === "data.ttl" ? " · validated against shapes.ttl" : f === "messy.ttl" ? " · validated against its own shapes" : ""}</span><span class="sp"></span>${fixable.length ? `<button class="btn ph" style="display:none" data-applyall>Fix all ${fixable.length}</button>` : ""}${Object.entries(cats).map(([c, n]) => `<button class="chip ${S.a.hide.includes(c) ? "off" : ""}" data-cat="${c}">${c} ${n}</button>`).join("")}</div>
    <div class="src">${body}</div></div>
  <aside><div class="panel"><h4>This file</h4><div class="big">${open.length}</div>open problem(s) · ${fixable.length} with a quick fix${fixable.length ? ` <div style="margin-top:8px"><button class="btn" data-applyall>Apply all ${fixable.length} fixes</button></div>` : ""}
    <ul>${Object.entries(cats).map(([c, n]) => `<li>${c}: ${n}</li>`).join("")}</ul>${applied.length ? `<p style="color:#9a6700;font-size:12px">Edits applied by the prototype; a real build re-checks on every keystroke.</p>` : ""}</div>

// =========================== B: Shapes grid ===========================
function shaclModel() {
  const data = REAL["data.ttl"], shapes = REAL["shapes.ttl"], sl = linesOf(shapes.text), dl = linesOf(data.text);

  });

  const viol = diagsOf("data.ttl").filter(d => d.code === "shacl-violation").map(d => {
    let m;
    if ((m = d.msg.match(/^(\S+) of (\S+): expected at least/))) return { ...d, path: m[1], node: m[2], kind: "minCount" };
    if ((m = d.msg.match(/^(\S+) of (\S+): expected at most/))) return { ...d, path: m[1], node: m[2], kind: "maxCount" };
    if ((m = d.msg.match(/\((\S+) of (\S+)\) is not a valid/))) return { ...d, path: m[1], node: m[2], kind: "datatype" };
    if ((m = d.msg.match(/\((\S+) of (\S+)\) is less than/))) return { ...d, path: m[1], node: m[2], kind: "minInclusive" };
    return { ...d };
  });
  return { cols, nodes, viol, other: diagsOf("data.ttl").filter(d => d.code !== "shacl-violation") };
}
const KIND = { minCount: "at least", maxCount: "at most", datatype: "datatype", minInclusive: "min" };
function VariantB() {
  const M = shaclModel(), sel = S.b;
  const v = (n, c) => M.viol.filter(x => x.node === n && x.path === c.path && x.kind === c.kind);
  const failing = new Set(M.viol.map(x => x.node));
  const cellBtn = (n, c) => { const bad = v(n.id, c).length, on = sel.node === n.id && sel.path === c.path && sel.kind === c.kind;
    return `<button class="cell ${bad ? "fail" : "pass"} ${on ? "sel" : ""}" data-cell="${n.id}|${c.path}|${c.kind}" aria-label="${n.id} ${c.path} ${c.kind}: ${bad ? "fails" : "passes"}">${bad ? "✕" : "✓"}</button>`; };
  const col = M.cols.find(c => c.path === sel.path && c.kind === sel.kind) || M.cols[0];
  const node = M.nodes.find(n => n.id === sel.node) || M.nodes[0];
  const vs = v(node.id, col);
  const dRows = srcLines("data.ttl", vs.length ? vs : [], [], vs.length ? [] : []).filter(r => r.line === node.line);
  const sRows = srcLines("shapes.ttl", [], [], [{ line: col.line, col: col.col, endCol: col.endCol, cls: "k" }]).filter(r => r.line >= col.line - 0 && r.line <= col.line);
  const shapeHead = srcLines("shapes.ttl", []).filter(r => r.line === 4 || r.line === 5);
  const detail = `<div class="detail"><h3 class="mono">${esc(node.id)} · ${esc(col.path)} · ${KIND[col.kind]} ${esc(col.val)}</h3>${
    vs.length ? vs.map(x => `<div class="msg">✕ ${esc(x.msg)} <span class="real">real</span></div>`).join("") : `<div class="msg ok">✓ Conforms. Inferred: the server reported no violation for this pair.</div>`}
    <div class="excerpt"><div class="lbl">data.ttl, line ${node.line + 1}</div><div class="src">${dRows.map(r => rowHTML({ ...r, cls: "hot" })).join("")}</div></div>
    <div class="excerpt"><div class="lbl">shapes.ttl, the constraint</div><div class="src">${shapeHead.map(rowHTML).join("")}${sRows.map(r => rowHTML({ ...r, cls: "hot" })).join("")}</div></div>
    <div style="margin-top:12px;font-size:12px;color:#8b93a1">Click any cell to see both ends of a violation. Not shown: rename <span class="mono">ex:age</span> once and turtle-lsp renames it in the data, the shapes and any query.</div></div>`;
  const table = `<div class="gridwrap"><table><thead><tr><th></th>${M.cols.map(c => `<th><span class="p">${esc(c.path)}</span>${KIND[c.kind]} ${esc(c.val)}</th>`).join("")}</tr></thead><tbody>${
    M.nodes.map(n => `<tr><td class="node">${esc(n.id)}<small>line ${n.line + 1} · ${failing.has(n.id) ? "does not conform" : "conforms"}</small></td>${M.cols.map(c => `<td>${cellBtn(n, c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="legend">Rows: focus nodes of ex:PersonShape (sh:targetClass ex:Person). Columns: its property constraints. ✕ cells are real violations; ✓ cells are inferred from their absence.</div></div>`;
  const cards = `<div class="cards">${M.nodes.map(n => `<div class="ncard"><div class="hd"><span>${esc(n.id)}</span><span style="color:${failing.has(n.id) ? "#ff8a8a" : "#6ee7a8"}">${failing.has(n.id) ? "does not conform" : "conforms"}</span></div>${
    M.cols.map(c => { const bad = v(n.id, c).length, on = sel.node === n.id && sel.path === c.path && sel.kind === c.kind; return `<button class="${bad ? "fail" : "pass"} ${on ? "sel" : ""}" data-cell="${n.id}|${c.path}|${c.kind}"><span class="st">${bad ? "✕" : "✓"}</span><span class="mono">${esc(c.path)}</span><span>${KIND[c.kind]} ${esc(c.val)}</span></button>`; }).join("")}</div>`).join("")}</div>`;
  return `<div class="B"><div class="top"><div class="eyebrow">SHACL validation · runs in this tab · SHACL Core + SHACL-SPARQL</div>
    <h1><em>${failing.size} of ${M.nodes.length}</em> people do not conform to ex:PersonShape</h1>
    <div class="sub">${M.viol.length} violations, each tied to the exact value in the data and the exact constraint in the shapes.</div>
    <div class="inputs"><span>Data: data.ttl (${linesOf(REAL["data.ttl"].text).length} lines)</span><span>Shapes: shapes.ttl</span><span>+ Add data or shapes file</span><span>Download report (Turtle / JSON) <b class="mock">mocked</b></span></div></div>
    <div class="main">${table}${cards}${detail}</div>
    <div class="others"><b>Other findings in data.ttl:</b> ${M.other.map(d => `${SEV[d.sev]} line ${d.line + 1}: ${esc(d.msg)}`).join("; ") || "none"}</div></div>`;
}

// =========================== C: Pipeline ===========================
const C_FILES = ["broken.ttl", "data.ttl", "messy.ttl", "query.rq", "messy.rq"];
const MOCK_NT = `<https://example.org/alice> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://example.org/Person> .
<https://example.org/alice> <https://example.org/name> "Alice" .
<https://example.org/alice> <https://example.org/age> "42"^^<http://www.w3.org/2001/XMLSchema#integer> .
<https://example.org/bob> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://example.org/Person> .
<https://example.org/bob> <https://example.org/age> "forty" .
<https://example.org/carol> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://example.org/Person> .
<https://example.org/carol> <https://example.org/name> "Carol" .
<https://example.org/carol> <https://example.org/name> "Caz" .
<https://example.org/carol> <https://example.org/age> "-3"^^<http://www.w3.org/2001/XMLSchema#integer> .`;
function VariantC() {
  const f = S.c.file, R = REAL[f], isQ = R.lang === "sparql";
  const gs = grouped(f), nonShacl = gs.filter(g => g.code !== "shacl-violation"), shacl = gs.filter(g => g.code === "shacl-violation");
  const syntax = gs.filter(g => g.code === "syntax");
  const fixable = nonShacl.filter(g => fixFor(g));
  const chosen = fixable.filter(g => S.c.fixes[g.id] !== false);
  const syntaxLeft = syntax.length && !(S.c.applied && syntax.every(g => chosen.includes(g)));
  const row = g => `<div class="row"><span class="where">${g.line + 1}:${g.col + 1}</span><span class="sv${g.sev}">${SEV[g.sev]}</span><span class="msg">${esc(g.msg)}${g.follow.length ? ` <i style="color:#8a7f70">(+${g.follow.length} follow-on)</i>` : ""}</span></div>`;
  const steps = [];
  steps.push({ k: "read", n: 1, title: "Read", st: "done", sum: `${isQ ? "SPARQL query" : "Turtle"} · ${linesOf(R.text).length} lines · ${R.text.length} bytes`,
    body: `<pre>${esc(R.text)}</pre>` });
  steps.push({ k: "check", n: 2, title: "Check", st: nonShacl.length ? "issues" : "done", real: 1,
    sum: nonShacl.length ? `${nonShacl.length} problem(s): ${[...new Set(nonShacl.map(g => CAT(g.code)))].join(", ")}` : "No problems",
    body: nonShacl.length ? nonShacl.map(row).join("") : "Syntax, prefixes and vocabulary terms all check out." });
  steps.push({ k: "fix", n: 3, title: "Fix", st: !fixable.length ? "skip" : S.c.applied ? "done" : "issues", mock: fixable.length > 0,
    sum: !fixable.length ? "Nothing to fix" : S.c.applied ? `${chosen.length} fix(es) applied` : `${fixable.length} quick fix(es) ready`,
    body: fixable.length ? `${fixable.map(g => { const fx = fixFor(g); return `<label class="fix"><input type="checkbox" data-cfix="${g.id}" ${S.c.fixes[g.id] !== false ? "checked" : ""} ${S.c.applied ? "disabled" : ""}><span><b>${esc(fx.label)}</b><br><span style="color:#6b5f50">line ${g.line + 1}: ${esc(g.msg)}</span></span></label>`; }).join("")}
      <button class="go" data-capply ${S.c.applied ? "disabled" : ""}>${S.c.applied ? "Applied" : `Apply ${chosen.length} fix(es)`}</button>${S.c.applied ? ` <button class="go" style="background:#8a7f70" data-cundo>Undo</button>` : ""}
      <div class="note">Quick fixes are real server features; the edits shown here are written by the prototype (mocked). Steps below are not re-run after applying.</div>` : "No quick fixes apply." });
  const shapesFrom = f === "data.ttl" ? "shapes.ttl" : f === "messy.ttl" ? "the shapes in the same file" : null;
  if (!isQ) steps.push({ k: "shacl", n: 4, title: "Validate against shapes", st: !shapesFrom ? "skip" : shacl.length ? "issues" : "done", real: !!shapesFrom,
    sum: !shapesFrom ? "No shapes yet. Add a shapes file to validate." : shacl.length ? `${shacl.length} violation(s) using ${shapesFrom}` : "Conforms",
    body: shapesFrom ? (shacl.length ? shacl.map(row).join("") : "Conforms.") : "Drop a SHACL file here, or keep shapes in the same file: turtle-lsp finds them." });
  const fmtSame = R.formatted === R.text;
  steps.push({ k: "format", n: isQ ? 4 : 5, title: "Format", st: syntaxLeft ? "blocked" : R.formatted ? "done" : "blocked", real: !!R.formatted,
    sum: syntaxLeft ? `Blocked by ${syntax.length} syntax error(s)` : R.formatted ? (fmtSame ? "Already formatted" : `Same ${isQ ? "algebra" : "graph"}, new layout · ${linesOf(R.text).length} → ${linesOf(R.formatted).length} lines`) : "Would run now (output not captured for the fixed text)",
    body: R.formatted ? `<pre>${esc(R.formatted)}</pre><div class="note">Proven to keep the ${isQ ? "SPARQL algebra" : "graph"}: the tool checks that before and after are equal.</div>` : "The formatter runs once the file parses." });
  if (!isQ) steps.push({ k: "convert", n: 6, title: "Convert to N-Triples", st: syntaxLeft ? "blocked" : "mock", mock: true,
    sum: syntaxLeft ? "Blocked by syntax errors" : "Planned feature · output mocked",
    body: f === "data.ttl" ? `<pre>${esc(MOCK_NT)}</pre><div class="note">MOCKED: conversion is planned, not built.</div>` : "MOCKED: conversion is planned; sample output exists only for data.ttl." });
  else steps.push({ k: "run", n: 5, title: "Run on a local graph", st: syntaxLeft ? "blocked" : "mock", mock: true, sum: "Needs a query engine next to turtle-lsp · results mocked",
    body: `<table><tr><th>?person</th><th>?name</th>${f === "query.rq" ? "<th>?nick</th>" : "<th>?orgs</th>"}</tr><tr><td>ex:alice</td><td>"Alice"</td><td>${f === "query.rq" ? "<i>unbound</i>" : "2"}</td></tr><tr><td>ex:carol</td><td>"Carol"</td><td>${f === "query.rq" ? "<i>unbound</i>" : "3"}</td></tr></table><div class="note">MOCKED: turtle-lsp does not execute queries. ${f === "query.rq" ? "The empty ?nick column is what step 2 warned about." : ""}</div>` });
  const dotTxt = s => ({ done: "✓", issues: "!", blocked: "–", skip: "·", mock: "~" }[s.st]);
  return `<div class="C"><div class="col"><h1>Check, fix, format, convert.</h1><p class="lede">Each step feeds the next and shows its state. Everything runs in this tab; nothing is uploaded.</p>
    <div class="pick">${C_FILES.map(x => `<button class="${x === f ? "on" : ""}" data-cfile="${x}">${x}</button>`).join("")}<button>+ Open or drop a file</button></div>
    ${steps.map(s => `<div class="step"><div class="dot ${s.st}">${dotTxt(s)}</div><div class="box"><div class="hd" data-cstep="${s.k}"><h3>${s.n}. ${s.title}</h3>${s.real ? `<span class="real">real</span>` : ""}${s.mock ? `<span class="mock">mocked</span>` : ""}<span class="st">${esc(s.sum)}</span><span class="sp"></span><span>${S.c.open === s.k ? "▾" : "▸"}</span></div>${S.c.open === s.k ? `<div class="bd">${s.body}</div>` : ""}</div></div>`).join("")}
    <div class="share">Share this run: the input and every choice go in the link, not on a server. <button class="go" style="margin:0">Copy link</button><span class="mock">mocked</span></div></div></div>`;
}

// =========================== wiring ===========================
const V = { A: VariantA, B: VariantB, C: VariantC };
const cur = () => { const x = new URLSearchParams(location.search).get("variant"); return V[x] ? x : "A"; };
function render() {
  S.variant = cur();
  document.getElementById("app").innerHTML = V[S.variant]();
  document.getElementById("vlabel").textContent = `${S.variant} (${NAMES[S.variant]})`;
  document.getElementById("pstate").textContent = JSON.stringify(S, null, 2);
  console.log("[prototype state]", JSON.parse(JSON.stringify(S)));
}
function go(d) {
  const k = Object.keys(V), i = k.indexOf(cur()), p = new URLSearchParams(location.search);
  p.set("variant", k[(i + d + k.length) % k.length]);
  history.replaceState(null, "", "?" + p); render(); scrollTo(0, 0);
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("stbtn").onclick = () => { const p = document.getElementById("pstate"); p.hidden = !p.hidden; };
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1);
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-afile],[data-cat],[data-apply],[data-undo],[data-applyall],[data-fmt],[data-cell],[data-cfile],[data-cstep],[data-capply],[data-cundo]");
  if (!t) return;
  const d = t.dataset, f = S.a.file, ap = S.applied[f] = S.applied[f] || [];
  if (d.afile) { S.a.file = d.afile; S.a.fmt = false; }
  else if (d.cat) S.a.hide = S.a.hide.includes(d.cat) ? S.a.hide.filter(x => x !== d.cat) : [...S.a.hide, d.cat];
  else if (d.apply) ap.push(+d.apply);
  else if (d.undo) S.applied[f] = ap.filter(x => x !== +d.undo);
  else if ("applyall" in d) grouped(f).forEach(g => { if (fixFor(g) && !ap.includes(g.id)) ap.push(g.id); });
  else if ("fmt" in d) S.a.fmt = !S.a.fmt;
  else if (d.cell) { const [node, path, kind] = d.cell.split("|"); S.b = { node, path, kind }; }
  else if (d.cfile) S.c = { file: d.cfile, fixes: {}, applied: false, open: "check" };
  else if (d.cstep) S.c.open = S.c.open === d.cstep ? null : d.cstep;
  else if ("capply" in d) { S.c.applied = true; S.c.open = "format"; }
  else if ("cundo" in d) S.c.applied = false;
  render();
});
document.addEventListener("change", e => { const d = e.target.dataset; if (d.cfix) { S.c.fixes[d.cfix] = e.target.checked; render(); } });
render();
</script>
</body>
