# cargo deny check: vulnerable crates, licences, duplicate/banned crates and
# where crates may come from. Run in CI; locally: cargo deny check

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
version = 2
yanked = "deny"
ignore = [
    # quick-xml < 0.41 (0.37.5 in the lock file): quadratic attribute-duplicate check
    # and namespace allocation, both proportional to the size of one start tag. It is
    # reached through two crates:
    #   - oxrdfxml 0.2.4 (the latest release), a dev-dependency only: an oracle in
    #     tests and an example (src/rdfxml/grammar/tests.rs, tests/owx_oracle.rs,
    #     examples/corpus.rs). The built crate does not link it. RDF/XML and OWL/XML
    #     documents and owl:imports (src/imports/ntriples.rs) go through our own XML
    #     scanner (src/rdfxml/xml.rs).
    #   - sparesults 0.3.4, through spareval. Its XML reader runs only for the
    #     results of a SERVICE call, and turtle-lsp registers no service handler
    #     (src/ has none), so it never parses a document.
    # Re-check by 2027-01-22: drop both entries once oxrdfxml and sparesults release
    # a quick-xml >= 0.41, or when a new input path reaches either parser.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml reads no user input: RDF/XML goes through our own scanner (src/rdfxml/xml.rs), and with no SERVICE handler sparesults never parses XML here; re-check 2027-01-22" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml reads no user input: RDF/XML goes through our own scanner (src/rdfxml/xml.rs), and with no SERVICE handler sparesults never parses XML here; re-check 2027-01-22" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# ISC, BSD-3-Clause and CDLA-Permissive-2.0 come with the HTTPS client used to
# fetch owl:imports (rustls, ring, rustls-webpki, untrusted, subtle,
# webpki-roots); all are permissive, attribution-only licences.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# TurbOWL is not on crates.io; it is pinned to a tag of its repository.
allow-git = ["https://github.com/abhishekkundu25/turbowl"]
