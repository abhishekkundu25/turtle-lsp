<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDF Editor</title>
<meta name="description" content="Edit Turtle, TriG, N-Triples, N-Quads and SPARQL with turtle-lsp running in this tab. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231d2330%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22monospace%22 font-size=%2212%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3Ettl%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="search.css">
<script src="vendor/monaco/vs/loader.js"></script>
<script type="module" src="editor.js"></script>
</head>
<body data-ready="false" data-busy="true">
<div class="wb">
  <nav class="activity" aria-label="Views">
    <button class="act on" id="act-explorer" title="Explorer (Ctrl+Shift+E)" aria-label="Explorer"><span class="codicon codicon-files"></span></button>
    <button class="act" id="act-search" title="Search (Ctrl+Shift+F)" aria-label="Search"><span class="codicon codicon-search"></span></button>
    <button class="act" id="act-outline" title="Outline" aria-label="Outline"><span class="codicon codicon-symbol-class"></span></button>
    <span class="act-sp"></span>
    <a class="act" href="index.html" title="Toolbox: format, validate and check files without the editor" aria-label="Toolbox"><span class="codicon codicon-tools"></span></a>
  </nav>

  <aside class="side" aria-label="Side bar">
    <section class="view" id="view-explorer">
      <div class="view-hd">
        <span class="view-title">Explorer</span>
        <span class="sp"></span>
        <button class="ic" aria-label="New File" title="New File"><span class="codicon codicon-new-file"></span></button>
        <button class="ic" aria-label="New Folder" title="New Folder"><span class="codicon codicon-new-folder"></span></button>
        <button class="ic" aria-label="Import Files" title="Import Files…"><span class="codicon codicon-cloud-upload"></span></button>
        <button class="ic" aria-label="Import Folder" title="Import Folder…"><span class="codicon codicon-folder-library"></span></button>
        <button class="ic" aria-label="Open Folder in Place" title="Open Folder… (edit the files on your disk, Ctrl+S saves)" id="open-in-place" hidden><span class="codicon codicon-folder-opened"></span></button>
        <button class="ic" aria-label="Download File" title="Download File"><span class="codicon codicon-desktop-download"></span></button>
        <button class="ic" aria-label="Export Workspace as Zip" title="Export Workspace as Zip"><span class="codicon codicon-file-zip"></span></button>
        <button class="ic" aria-label="Collapse Folders" title="Collapse Folders"><span class="codicon codicon-collapse-all"></span></button>
      </div>
      <div class="tree" id="tree" role="tree" aria-label="Explorer" tabindex="0"></div>
      <input type="file" id="files-input" class="hidden-input" multiple tabindex="-1">
      <input type="file" id="folder-input" class="hidden-input" webkitdirectory multiple tabindex="-1">
    </section>
    <section class="view" id="view-search" hidden></section>
    <section class="view" id="view-outline" hidden>
      <div class="view-hd"><span class="view-title">Outline</span></div>
      <div class="outline" id="outline"></div>
    </section>
  </aside>

  <main class="center">
    <div class="groups" id="groups"></div>
  </main>

  <section class="panel" aria-label="Panel">
    <div class="panel-hd" role="tablist" aria-label="Panel">
      <button class="ptab on" role="tab" aria-selected="true" id="tab-problems">Problems <span class="badge" id="problems-count">0</span></button>
      <span class="sp"></span>
      <div class="pfilter" role="group" aria-label="Show">
        <button class="pf on" data-filter="all">All</button>
        <button class="pf" data-filter="errors">Errors</button>
        <button class="pf" data-filter="warnings">Warnings</button>
        <button class="pf" data-filter="shacl">SHACL</button>
      </div>
      <button class="ic" aria-label="Fix All Problems" title="Fix All Problems (every preferred quick fix)"><span class="codicon codicon-lightbulb-autofix"></span></button>
      <button class="ic" aria-label="Toggle Panel" title="Toggle Panel (Ctrl+J)" id="panel-toggle"><span class="codicon codicon-chevron-down"></span></button>
    </div>
    <div class="problems" id="problems" role="tabpanel" aria-labelledby="tab-problems"></div>
  </section>

  <footer class="status" aria-label="Status bar">
    <button class="st" id="status-problems" title="Problems"><span class="codicon codicon-error"></span><span id="status-errors">0</span><span class="codicon codicon-warning"></span><span id="status-warnings">0</span></button>
    <span class="st" id="status-shacl-wrap" title="SHACL violations"><span class="codicon codicon-shield"></span><span id="status-shacl">0</span> SHACL</span>
    <span class="st" id="status-busy" hidden><span class="codicon codicon-loading codicon-modifier-spin"></span> Analysing</span>
    <span class="sp"></span>
    <button class="st" id="status-labels" title="Show rdfs:label next to every term (Alt+L)">Labels: Off</button>
    <span class="st" id="status-pos"></span>
    <span class="st" id="status-lang"></span>
    <span class="st" id="status-storage" title="Where your files are kept">Kept in this browser</span>
    <span class="st" id="status-version">turtle-lsp</span>
  </footer>
</div>
<div class="quick" id="quick" hidden>
  <input id="quick-input" aria-label="Go to file" placeholder="Go to file by name" autocomplete="off" spellcheck="false">
  <div class="quick-list" id="quick-list" role="listbox"></div>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="Unsaved changes" hidden></div>
</body>
</html>
