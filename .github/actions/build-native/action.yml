name: Build native turtle-lsp
description: Build target/release/turtle-lsp[.exe] once for the current OS and upload it as an artifact.
inputs:
  artifact:
    description: Artifact name for this OS binary
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: test
        save-if: false
    - shell: bash
      run: cargo build --release --locked
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.os == 'Windows' && 'target/release/turtle-lsp.exe' || 'target/release/turtle-lsp' }}
        if-no-files-found: error
        retention-days: 7
