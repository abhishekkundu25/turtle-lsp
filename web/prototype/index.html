<!doctype html>
<!--
  PROTOTYPE — throwaway. Three radically different layouts for the turtle-lsp
  web showcase, switchable via ?variant=A|B|C and the floating bar at the
  bottom (or the ← / → keys). The language server is MOCKED here: the
  diagnostics, hovers, completions and timings below are canned data. The
  question this answers is "what should the showcase look like?", nothing else.

  Run: npm run web:prototype   (or just open this file in a browser).
  The tool prototype (format, validate, SHACL, SPARQL, convert) is tool.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turtle-lsp showcase (prototype)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  button { font: inherit; cursor: pointer; }

  /* ---------- shared code rendering ---------- */
  .code { margin: 0; padding: 10px 0; font-size: 13px; line-height: 20px; white-space: pre; overflow: auto; }
  .code .ln { display: block; padding: 0 14px 0 0; position: relative; }
  .code .ln.focus { background: var(--focus, rgba(255,215,0,.12)); }
  .code .gutter { display: inline-block; width: 44px; text-align: right; padding-right: 14px; color: var(--gutter, #858585); user-select: none; }
  .t-com { color: var(--com, #6a9955); font-style: italic; }
  .t-str { color: var(--str, #ce9178); }
  .t-iri { color: var(--iri, #4fc1ff); }
  .t-pfx { color: var(--pfx, #c586c0); }
  .t-loc { color: var(--loc, #9cdcfe); }
  .t-cls { color: var(--cls, #4ec9b0); }
  .t-kw  { color: var(--kw, #569cd6); font-weight: 600; }
  .t-var { color: var(--var, #dcdcaa); }
  .t-num { color: var(--num, #b5cea8); }
  .sq-error { text-decoration: underline wavy #f14c4c; text-underline-offset: 3px; }
  .sq-warning { text-decoration: underline wavy #cca700; text-underline-offset: 3px; }
  .sq-hint { text-decoration: underline dotted #888; text-underline-offset: 3px; }
  .tok { cursor: help; }
  .tok:hover { background: rgba(128,128,128,.18); border-radius: 2px; }
  .inlay { color: var(--inlay, #8a8a8a); background: var(--inlay-bg, rgba(128,128,128,.15)); border-radius: 3px; padding: 0 4px; margin-left: 4px; font-size: 11.5px; font-style: italic; }
  .renamed { background: rgba(78,201,176,.25); border-radius: 2px; }

  .popup { position: fixed; z-index: 50; max-width: 420px; border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.35); font-size: 13px; }
  .popup.hover { padding: 10px 12px; background: var(--pop-bg, #252526); color: var(--pop-fg, #ddd); border: 1px solid var(--pop-bd, #454545); }
  .popup.hover h4 { margin: 0 0 4px; font: 600 13px ui-monospace, Menlo, monospace; }
  .popup.hover .muted { opacity: .7; font-size: 12px; }
  .popup.complete { background: var(--pop-bg, #252526); color: var(--pop-fg, #ddd); border: 1px solid var(--pop-bd, #454545); min-width: 280px; padding: 4px 0; }
  .popup.complete div { padding: 3px 10px; display: flex; gap: 10px; justify-content: space-between; }
  .popup.complete div.sel { background: #04395e; }
  .popup.complete small { opacity: .65; }

  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; background: #1e1e1e; color: #fff; padding: 8px 14px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.4); font-size: 13px; }

  /* ---------- prototype switcher (not part of any design) ---------- */
  #switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; background: #ff3d7f; color: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 600 13px system-ui, sans-serif; }
  #switcher button { background: rgba(255,255,255,.18); color: #fff; border: 0; width: 30px; height: 30px; border-radius: 50%; }
  #switcher span { padding: 0 12px; white-space: nowrap; }

  /* ================= Variant A: the IDE ================= */
  .A { --bg: #1e1e1e; height: 100vh; display: grid; grid-template-rows: 36px 1fr 180px 24px; grid-template-columns: 220px 1fr 300px; background: var(--bg); color: #ccc; }
  .A header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: #323233; color: #ccc; font-size: 13px; }
  .A header .brand { font-weight: 700; color: #fff; }
  .A header .sp { flex: 1; }
  .A header a { color: #8cc8ff; text-decoration: none; }
  .A header button { background: #0e639c; color: #fff; border: 0; padding: 4px 10px; border-radius: 3px; }
  .A aside.tree { grid-row: 2 / 4; background: #252526; padding: 8px 0; overflow: auto; }
  .A aside.tree h6 { margin: 4px 14px 6px; font-size: 11px; letter-spacing: .08em; color: #bbb; }
  .A aside.tree div { padding: 3px 18px; cursor: pointer; display: flex; justify-content: space-between; }
  .A aside.tree div.on { background: #37373d; color: #fff; }
  .A aside.tree .badge { font-size: 11px; border-radius: 8px; padding: 0 6px; }
  .A .badge.e { background: #5a1d1d; color: #f88; }
  .A .badge.w { background: #4d3d00; color: #ec6; }
  .A main { display: flex; flex-direction: column; min-width: 0; }
  .A .tabs { display: flex; background: #252526; overflow: auto; }
  .A .tabs div { padding: 7px 14px; border-right: 1px solid #1e1e1e; background: #2d2d2d; color: #999; cursor: pointer; white-space: nowrap; }
  .A .tabs div.on { background: #1e1e1e; color: #fff; border-top: 1px solid #0e639c; }
  .A main .code { flex: 1; }
  .A .problems { grid-column: 2; background: #1e1e1e; border-top: 1px solid #333; overflow: auto; }
  .A .problems h6 { margin: 0; padding: 6px 12px; font-size: 11px; letter-spacing: .08em; color: #bbb; border-bottom: 1px solid #333; }
  .A .problems div { padding: 3px 12px; cursor: pointer; display: flex; gap: 8px; }
  .A .problems div:hover { background: #2a2d2e; }
  .A .problems .fix { margin-left: auto; color: #8cc8ff; }
  .A aside.tour { grid-row: 2 / 4; grid-column: 3; background: #252526; border-left: 1px solid #333; padding: 14px; overflow: auto; }
  .A aside.tour h3 { margin: 0 0 4px; color: #fff; font-size: 14px; }
  .A aside.tour ol { padding-left: 18px; margin: 10px 0; }
  .A aside.tour li { margin: 0 0 10px; color: #aaa; cursor: pointer; }
  .A aside.tour li.on { color: #fff; }
  .A aside.tour li b { color: #ddd; }
  .A aside.tour .go { background: #0e639c; color: #fff; border: 0; padding: 4px 10px; border-radius: 3px; margin-top: 4px; }
  .A footer { grid-column: 1 / -1; background: #007acc; color: #fff; display: flex; gap: 18px; align-items: center; padding: 0 10px; font-size: 12px; }

  /* ================= Variant B: the guided story ================= */
  .B { --bg: #fbfaf7; --com: #8a8a7a; --str: #a3542a; --iri: #2a6db0; --pfx: #8e3a8e; --loc: #22577a; --cls: #187a6c; --kw: #1f4fa0; --var: #8a6a00; --num: #3d7a3d; --gutter: #b9b6ad; --focus: #fff2b8; --pop-bg: #fff; --pop-fg: #222; --pop-bd: #ddd; --inlay: #6c6c60; --inlay-bg: #eeeadf;
       background: var(--bg); color: #222; min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 420px) 1fr; }
  .B .story { padding: 40px 36px 120px; border-right: 1px solid #e6e2d8; height: 100vh; overflow: auto; position: sticky; top: 0; }
  .B .story .kicker { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: #9a6b00; font-weight: 700; }
  .B .story h1 { font: 700 30px/1.15 Georgia, "Iowan Old Style", serif; margin: 8px 0 12px; }
  .B .story p.lead { color: #555; font-size: 15px; }
  .B .step { margin: 22px 0; padding: 16px 18px; border-radius: 10px; border: 1px solid #e6e2d8; background: #fff; cursor: pointer; transition: transform .15s; }
  .B .step.on { border-color: #e0b100; box-shadow: 0 6px 24px rgba(224,177,0,.18); transform: translateX(6px); }
  .B .step .n { font: 700 12px system-ui; color: #9a6b00; }
  .B .step h3 { margin: 4px 0 6px; font: 700 18px Georgia, serif; }
  .B .step p { margin: 0; color: #555; }
  .B .step .stat { margin-top: 10px; font: 600 12px ui-monospace, monospace; color: #187a6c; }
  .B .story .cta { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .B .story .cta a { padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .B .cta .vs { background: #1f4fa0; color: #fff; }
  .B .cta .nv { background: #fff; color: #1f4fa0; border: 1px solid #1f4fa0; }
  .B .stage { padding: 40px 48px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .B .stage .filebar { display: flex; gap: 8px; flex-wrap: wrap; }
  .B .stage .filebar span { font: 12px ui-monospace, monospace; padding: 4px 10px; border-radius: 999px; background: #eeeadf; color: #555; cursor: pointer; }
  .B .stage .filebar span.on { background: #222; color: #fff; }
  .B .paper { background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(60,50,20,.10); border: 1px solid #ebe7dc; overflow: hidden; }
  .B .paper .code { max-height: 60vh; }
  .B .callout { align-self: flex-start; background: #222; color: #fff; padding: 10px 14px; border-radius: 10px; max-width: 560px; font-size: 13.5px; }
  .B .callout .diag { display: block; margin-top: 6px; color: #ffcf66; font-family: ui-monospace, monospace; font-size: 12px; }
  .B .callout button { margin-top: 8px; background: #e0b100; color: #222; border: 0; padding: 5px 10px; border-radius: 6px; font-weight: 700; }
  .B .metrics { display: flex; gap: 28px; margin-top: 6px; }
  .B .metrics div b { display: block; font: 700 28px Georgia, serif; }
  .B .metrics div small { color: #777; }

  /* ================= Variant C: the playground ================= */
  .C { --bg: #0f1115; --pop-bg: #161a22; --pop-bd: #2a3140; background: radial-gradient(1200px 600px at 20% -10%, #1b2440 0%, #0f1115 55%); color: #d6dae3; min-height: 100vh; display: flex; flex-direction: column; }
  .C .top { display: flex; align-items: center; gap: 16px; padding: 14px 22px; }
  .C .top .brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
  .C .top .brand em { font-style: normal; color: #6ee7b7; }
  .C .top .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .C .top .pills span { padding: 5px 11px; border-radius: 999px; background: #1a1f2b; border: 1px solid #262d3b; font: 12px ui-monospace, monospace; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .C .top .pills span.on { background: #6ee7b7; color: #0f1115; border-color: #6ee7b7; }
  .C .top .pills i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .C .top .sp { flex: 1; }
  .C .top a { color: #9fb3ff; text-decoration: none; font-size: 13px; }
  .C .body { flex: 1; display: grid; grid-template-columns: 1fr 360px; gap: 18px; padding: 0 22px 90px; min-height: 0; }
  .C .editor { background: #0b0d12; border: 1px solid #222837; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .C .editor .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #1d2230; font-size: 12px; color: #8a93a6; }
  .C .editor .bar .lat { margin-left: auto; color: #6ee7b7; font-family: ui-monospace, monospace; }
  .C .editor .code { flex: 1; }
  .C .inspector { display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow: auto; }
  .C .card { background: #121620; border: 1px solid #222837; border-radius: 14px; padding: 14px; }
  .C .card h5 { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8a93a6; }
  .C .card .row { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid #1b2030; cursor: pointer; font-size: 13px; }
  .C .card .row:first-of-type { border-top: 0; }
  .C .card .row .fix { margin-left: auto; color: #6ee7b7; white-space: nowrap; }
  .C .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
  .C .chips { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 20; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  .C .chips button { background: #1a1f2b; color: #d6dae3; border: 1px solid #2a3140; padding: 8px 12px; border-radius: 999px; font-size: 13px; }
  .C .chips button:hover { border-color: #6ee7b7; }
  .C .bignum { font: 800 34px/1 system-ui; color: #6ee7b7; }
  .C .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .C .facts div small { display: block; color: #8a93a6; font-size: 11px; }

  @media (max-width: 860px) {
    .A { grid-template-columns: 1fr; grid-template-rows: 36px auto 1fr 160px 24px; }
    .A aside.tree, .A aside.tour { display: none; }
    .A .problems { grid-column: 1; }
    .B { grid-template-columns: 1fr; } .B .story { position: static; height: auto; padding-bottom: 10px; } .B .stage { padding: 16px; }
    .C .body { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher" title="Prototype switcher (← / →)"><button id="prev">‹</button><span id="vlabel"></span><button id="next">›</button></div>

<script>
// ===================== mocked workspace and server answers =====================
const FILES0 = {
"prefixes.ttl": `# Shared prefixes for every file in this folder.
@prefix ex:   <https://demo.example.org/def/> .
@prefix id:   <https://demo.example.org/id/> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix owl:  <http://www.w3.org/2002/07/owl#> .
@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .
@prefix sh:   <http://www.w3.org/ns/shacl#> .`,
"ontology.ttl": `# The ontology: two classes and three properties.
ex:Person a owl:Class ;
    rdfs:label "Person"@en ;
    rdfs:comment "A human being the dataset describes."@en .

ex:Organisation a owl:Class ;
    rdfs:label "Organisation"@en .

ex:name a owl:DatatypeProperty ;
    rdfs:domain ex:Person ;
    rdfs:range xsd:string .

ex:worksFor a owl:ObjectProperty ;
    rdfs:label "works for"@en ;
    rdfs:domain ex:Person ;
    rdfs:range ex:Organisation .`,
"shapes.ttl": `# Every person needs exactly one name.
ex:PersonShape a sh:NodeShape ;
    sh:targetClass ex:Person ;
    sh:property [
        sh:path ex:name ;
        sh:minCount 1 ;
        sh:maxCount 1 ;
        sh:datatype xsd:string
    ] .`,
"data.ttl": `# People and where they work.
id:Q42 a ex:Person ;
    ex:name "Douglas Adams" ;
    ex:worksFor id:Q190 .

id:Q190 a ex:Organisation ;
    rdfs:lable "BBC"@en .

id:Q5879 a ex:Person ;
    ex:worksFor id:Q190 .`,
"data.nq": `<https://demo.example.org/id/Q42> <https://demo.example.org/def/name> "Douglas Adams" <https://demo.example.org/graph/people> .
<https://demo.example.org/id/Q190> <http://www.w3.org/2000/01/rdf-schema#label> "BBC"@en <https://demo.example.org/graph/orgs> .`,
"people.rq": `# Everyone and their employer.
PREFIX ex: <https://demo.example.org/def/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?person ?name ?org
WHERE {
  ?person a ex:Person ;
    ex:name ?name .
  OPTIONAL { ?person ex:worksFr ?org }
}
ORDER BY ?name`,
"update.ru": `PREFIX ex: <https://demo.example.org/def/>

INSERT DATA {
  <https://demo.example.org/id/Q5879> ex:name "Goethe" .
}`,
};

// Diagnostics as the server would publish them (line/col 0-based).
const DIAGS0 = [
  { id: "d1", file: "data.ttl", line: 6, col: 4, len: 10, sev: "warning", code: "unknown-term", msg: "'lable' is not defined in the rdfs vocabulary. Did you mean 'label'?", fix: { title: "Change to 'rdfs:label'", from: "rdfs:lable", to: "rdfs:label" } },
  { id: "d2", file: "data.ttl", line: 8, col: 0, len: 8, sev: "error", code: "shacl-violation", msg: "Less than 1 value for ex:name (ex:PersonShape)", fix: { title: "Add ex:name", from: "id:Q5879 a ex:Person ;", to: "id:Q5879 a ex:Person ;\n    ex:name \"Johann Wolfgang von Goethe\" ;" } },
  { id: "d3", file: "people.rq", line: 8, col: 22, len: 10, sev: "warning", code: "undescribed-term", msg: "'ex:worksFr' is not described anywhere in the workspace. Did you mean 'ex:worksFor'?", fix: { title: "Change to 'ex:worksFor'", from: "ex:worksFr", to: "ex:worksFor" } },
  { id: "d4", file: "people.rq", line: 2, col: 0, len: 52, sev: "hint", code: "unused-prefix", msg: "Prefix 'rdfs:' is never used", fix: { title: "Remove unused prefix", from: "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n", to: "" } },
];

const HOVERS = {
  "ex:Person": { title: "ex:Person", kind: "owl:Class", body: "A human being the dataset describes.", where: "ontology.ttl:2" },
  "ex:Organisation": { title: "ex:Organisation", kind: "owl:Class", body: "Organisation", where: "ontology.ttl:6" },
  "ex:name": { title: "ex:name", kind: "owl:DatatypeProperty", body: "domain ex:Person · range xsd:string · required by ex:PersonShape", where: "ontology.ttl:9" },
  "ex:worksFor": { title: "ex:worksFor — works for", kind: "owl:ObjectProperty", body: "domain ex:Person · range ex:Organisation", where: "ontology.ttl:13" },
  "id:Q42": { title: "id:Q42 — Douglas Adams", kind: "ex:Person", body: "Described in data.ttl and data.nq", where: "data.ttl:2" },
  "id:Q190": { title: "id:Q190 — BBC", kind: "ex:Organisation", body: "Described in data.ttl", where: "data.ttl:6" },
  "rdfs:label": { title: "rdfs:label", kind: "rdf:Property", body: "A human-readable name for the subject.", where: "RDF Schema 1.1" },
  "sh:minCount": { title: "sh:minCount", kind: "SHACL", body: "The minimum number of values of the property.", where: "SHACL" },
};
const LABELS = { "id:Q42": "Douglas Adams", "id:Q190": "BBC", "id:Q5879": "Goethe" };
const COMPLETION = [
  ["ex:worksFor", "works for · property", true], ["ex:name", "name · property"], ["rdfs:label", "rdfs · property"], ["foaf:name", "adds @prefix foaf:"], ["schema:worksFor", "adds @prefix schema:"],
];

const TOUR = [
  { t: "Misspelled vocabulary terms", b: "rdfs:lable is caught by namespace IRI, with a one-click fix.", file: "data.ttl", line: 6, act: "fix:d1" },
  { t: "SHACL as you type", b: "Goethe has no ex:name, so ex:PersonShape reports a violation on the data.", file: "data.ttl", line: 8, act: "fix:d2" },
  { t: "Hover anywhere", b: "Labels, comments and where a term is described — across files.", file: "data.ttl", line: 1, act: "hover:ex:Person" },
  { t: "Completion that knows your ontology", b: "Properties whose rdfs:domain fits the subject come first.", file: "data.ttl", line: 3, act: "complete" },
  { t: "SPARQL that knows your data", b: "A typo in a query is checked against the workspace.", file: "people.rq", line: 8, act: "fix:d3" },
  { t: "Rename across formats", b: "Rename ex:Person and it changes in Turtle, SHACL and SPARQL.", file: "ontology.ttl", line: 1, act: "rename" },
];

// ===================== state =====================
let S = fresh();
function fresh() { return { files: { ...FILES0 }, diags: DIAGS0.map(d => ({ ...d })), file: "data.ttl", focus: 6, step: 0, renamed: false, lat: 0.6, popup: null, toast: null, edits: 0 }; }
function variant() { const v = new URLSearchParams(location.search).get("variant"); return ["A", "B", "C"].includes(v) ? v : "A"; }
const NAMES = { A: "IDE", B: "Guided story", C: "Playground" };

function bump() { S.lat = +(0.35 + Math.random() * 0.9).toFixed(2); S.edits++; }
function toast(msg) { S.toast = msg; render(); setTimeout(() => { S.toast = null; render(); }, 2200); }
function open(file, line) { S.file = file; S.focus = line ?? null; S.popup = null; render(); }
function applyFix(id) {
  const d = S.diags.find(x => x.id === id); if (!d) return;
  S.files[d.file] = S.files[d.file].replace(d.fix.from, d.fix.to);
  S.diags = S.diags.filter(x => x.id !== id);
  // Shift later diagnostics in the same file when a fix adds/removes lines (prototype-grade).
  const delta = d.fix.to.split("\n").length - d.fix.from.split("\n").length;
  S.diags.forEach(x => { if (x.file === d.file && x.line > d.line) x.line += delta; });
  bump(); S.file = d.file; S.focus = d.line; S.popup = null;
  toast(`${d.fix.title} · diagnostics in ${S.lat} ms`);
}
function doRename() {
  if (S.renamed) return;
  let n = 0, files = 0;
  for (const f of Object.keys(S.files)) {
    const c = (S.files[f].match(/ex:Person\b/g) || []).length;
    if (c) { files++; n += c; S.files[f] = S.files[f].replace(/ex:Person\b/g, "ex:Human"); }
  }
  S.renamed = true; bump(); toast(`Renamed ex:Person → ex:Human: ${n} edits in ${files} files`);
}
function act(a) {
  const step = TOUR[S.step];
  if (a.startsWith("fix:")) return applyFix(a.slice(4));
  if (a === "rename") return doRename();
  if (a.startsWith("hover:")) { const el = document.querySelector(`[data-tok="${a.slice(6)}"]`); if (el) showHover(el); return; }
  if (a === "complete") { const el = document.querySelector(`.ln[data-line="${step.line}"]`); if (el) showComplete(el); }
}
function goStep(i) { S.step = i; const s = TOUR[i]; open(s.file, s.line); }

// ===================== rendering helpers =====================
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const KW = /^(@prefix|@base|PREFIX|BASE|SELECT|WHERE|OPTIONAL|FILTER|ORDER|BY|INSERT|DATA|DELETE|ASK|CONSTRUCT|LIMIT|a)$/;
function classify(line) {
  // Per character: [syntax class, token]
  const out = Array.from(line, () => ["", null]);
  const mark = (s, e, cls, tok) => { for (let i = s; i < e; i++) out[i] = [cls, tok]; };
  const re = /(#.*$)|("(?:[^"\\]|\\.)*"(?:@[\w-]+|\^\^\S+)?)|(<[^>\s]*>)|(\?\w+)|([A-Za-z][\w-]*)?:([\w.-]*\w)?|(@?[A-Za-z]+)|(\d+(?:\.\d+)?)/g;
  let m;
  while ((m = re.exec(line))) {
    const [all] = m, s = m.index, e = s + all.length;
    if (!all) { re.lastIndex++; continue; }
    if (m[1] !== undefined) mark(s, e, "t-com");
    else if (m[2] !== undefined) mark(s, e, "t-str");
    else if (m[3] !== undefined) mark(s, e, "t-iri", null);
    else if (m[4] !== undefined) mark(s, e, "t-var");
    else if (all.includes(":")) {
      const p = all.indexOf(":");
      const local = all.slice(p + 1);
      mark(s, s + p + 1, "t-pfx", all);
      mark(s + p + 1, e, /^[A-Z]/.test(local) ? "t-cls" : "t-loc", all);
    } else if (m[7] !== undefined && KW.test(all)) mark(s, e, "t-kw");
    else if (m[8] !== undefined) mark(s, e, "t-num");
  }
  return out;
}
function codeHTML(file) {
  const lines = S.files[file].split("\n");
  const diags = S.diags.filter(d => d.file === file);
  return `<pre class="code">` + lines.map((line, i) => {
    const cls = classify(line);
    const sq = Array(line.length).fill(null);
    diags.filter(d => d.line === i).forEach(d => { for (let k = d.col; k < Math.min(line.length, d.col + d.len); k++) sq[k] = d; });
    let html = "", k = 0;
    while (k < line.length) {
      let j = k; while (j < line.length && cls[j][0] === cls[k][0] && cls[j][1] === cls[k][1] && sq[j] === sq[k]) j++;
      const [c, tok] = cls[k], d = sq[k], text = esc(line.slice(k, j));
      const classes = [c, d ? "sq-" + d.sev : "", tok ? "tok" : "", (S.renamed && tok === "ex:Human") ? "renamed" : ""].filter(Boolean).join(" ");
      html += `<span class="${classes}"${tok ? ` data-tok="${tok}"` : ""}${d ? ` data-diag="${d.id}"` : ""}>${text}</span>`;
      if (tok && LABELS[tok] && (j >= line.length || !/[\w:]/.test(line[j]))) html += `<span class="inlay">${LABELS[tok]}</span>`;
      k = j;
    }
    return `<span class="ln${S.focus === i ? " focus" : ""}" data-line="${i}"><span class="gutter">${i + 1}</span>${html || " "}</span>`;
  }).join("") + `</pre>`;
}
function counts(file) {
  const ds = S.diags.filter(d => d.file === file);
  return { e: ds.filter(d => d.sev === "error").length, w: ds.filter(d => d.sev === "warning").length };
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const sevIcon = s => ({ error: "⛔", warning: "⚠️", hint: "💡" }[s]);

// ===================== popups =====================
function showHover(el) {
  const tok = el.dataset.tok, h = HOVERS[tok], d = el.dataset.diag && S.diags.find(x => x.id === el.dataset.diag);
  if (!h && !d) return;
  const r = el.getBoundingClientRect();
  S.popup = { kind: "hover", x: r.left, y: r.bottom + 6, html:
    (d ? `<div style="margin-bottom:${h ? 8 : 0}px">${sevIcon(d.sev)} ${esc(d.msg)}<div class="muted">${d.code}${d.fix ? ` · <a href="#" data-fix="${d.id}">${esc(d.fix.title)}</a>` : ""}</div></div>` : "") +
    (h ? `<h4>${esc(h.title)}</h4><div class="muted">${esc(h.kind)}</div><div>${esc(h.body)}</div><div class="muted">Described in ${esc(h.where)}</div>` : "") };
  render();
}
function showComplete(lineEl) {
  const r = lineEl.getBoundingClientRect();
  S.popup = { kind: "complete", x: r.left + 90, y: r.bottom, html: COMPLETION.map(([l, d, sel]) => `<div class="${sel ? "sel" : ""}"><span class="mono">${l}</span><small>${d}</small></div>`).join("") };
  render();
}
function popupHTML() {
  if (!S.popup) return "";
  return `<div class="popup ${S.popup.kind}" style="left:${Math.min(S.popup.x, innerWidth - 440)}px;top:${S.popup.y}px">${S.popup.html}</div>`;
}

// ===================== Variant A: the IDE =====================
function VariantA() {
  const files = Object.keys(S.files);
  const all = S.diags;
  const s = TOUR[S.step];
  return `<div class="A">
    <header><span class="brand">🐢 turtle-lsp</span><span>in your browser · no backend</span><span class="sp"></span>
      <a href="#">VS Code Marketplace</a><a href="#">Neovim setup</a><button data-reset>Reset</button></header>
    <aside class="tree"><h6>DEMO WORKSPACE</h6>${files.map(f => { const c = counts(f); return `<div class="${f === S.file ? "on" : ""}" data-open="${f}"><span>${f}</span><span>${c.e ? `<span class="badge e">${c.e}</span>` : ""}${c.w ? ` <span class="badge w">${c.w}</span>` : ""}</span></div>`; }).join("")}</aside>
    <main><div class="tabs">${[S.file, ...files.filter(f => f !== S.file).slice(0, 3)].map(f => `<div class="${f === S.file ? "on" : ""}" data-open="${f}">${f}</div>`).join("")}</div>${codeHTML(S.file)}</main>
    <aside class="tour"><h3>Try this</h3><div style="color:#999;font-size:12px">${S.step + 1} of ${TOUR.length}</div>
      <ol>${TOUR.map((t, i) => `<li class="${i === S.step ? "on" : ""}" data-step="${i}"><b>${t.t}</b><br>${t.b}${i === S.step ? `<br><button class="go" data-act="${t.act}">Do it</button>` : ""}</li>`).join("")}</ol></aside>
    <section class="problems"><h6>PROBLEMS · ${all.length}</h6>${all.map(d => `<div data-goto="${d.id}"><span>${sevIcon(d.sev)}</span><span>${esc(d.msg)}</span><span style="color:#777">${d.file}:${d.line + 1}</span>${d.fix ? `<span class="fix" data-fix="${d.id}">${esc(d.fix.title)}</span>` : ""}</div>`).join("") || `<div style="color:#888">No problems 🎉</div>`}</section>
    <footer><span>⚡ diagnostics ${S.lat} ms</span><span>${S.file.endsWith(".rq") || S.file.endsWith(".ru") ? "SPARQL" : S.file.endsWith(".nq") ? "N-Quads" : "Turtle"}</span><span>${plural(all.filter(d => d.sev === "error").length, "error")} · ${plural(all.filter(d => d.sev === "warning").length, "warning")}</span><span style="margin-left:auto">WebAssembly · Web Worker</span></footer>
  </div>`;
}

// ===================== Variant B: the guided story =====================
function VariantB() {
  const s = TOUR[S.step];
  const d = S.diags.find(x => x.file === S.file && x.line === S.focus);
  return `<div class="B">
    <section class="story"><div class="kicker">turtle-lsp · runs in this tab</div>
      <h1>An RDF language server, without a server.</h1>
      <p class="lead">Turtle, TriG, N-Triples, N-Quads and SPARQL — checked, completed and refactored as you type, by the same Rust engine the VS Code extension uses, compiled to WebAssembly.</p>
      <div class="metrics"><div><b>${S.lat} ms</b><small>last keystroke</small></div><div><b>1137/1137</b><small>W3C RDF tests</small></div><div><b>425/426</b><small>W3C SPARQL</small></div></div>
      ${TOUR.map((t, i) => `<div class="step ${i === S.step ? "on" : ""}" data-step="${i}"><div class="n">STEP ${i + 1}</div><h3>${t.t}</h3><p>${t.b}</p>${i === S.step ? `<div class="stat">${t.file}:${t.line + 1}</div>` : ""}</div>`).join("")}
      <div class="cta"><a class="vs" href="#">Install for VS Code</a><a class="nv" href="#">Neovim setup</a><a class="nv" href="#" data-reset>Start over</a></div>
    </section>
    <section class="stage">
      <div class="filebar">${Object.keys(S.files).map(f => `<span class="${f === S.file ? "on" : ""}" data-open="${f}">${f}</span>`).join("")}</div>
      <div class="paper">${codeHTML(S.file)}</div>
      <div class="callout"><b>${s.t}.</b> ${s.b}${d ? `<span class="diag">${sevIcon(d.sev)} ${esc(d.msg)}</span>` : ""}<br><button data-act="${s.act}">${s.act.startsWith("fix") ? "Apply the fix" : s.act === "rename" ? "Rename it" : s.act === "complete" ? "Show completion" : "Show hover"}</button>
        ${S.step < TOUR.length - 1 ? ` <button data-step="${S.step + 1}" style="background:#444;color:#fff">Next →</button>` : ""}</div>
    </section>
  </div>`;
}

// ===================== Variant C: the playground =====================
function VariantC() {
  const files = Object.keys(S.files);
  const here = S.diags.filter(d => d.file === S.file);
  const colorOf = f => { const c = counts(f); return c.e ? "#f87171" : c.w ? "#fbbf24" : "#6ee7b7"; };
  return `<div class="C">
    <div class="top"><span class="brand">turtle<em>·</em>lsp <span style="color:#8a93a6;font-weight:500">playground</span></span>
      <div class="pills">${files.map(f => `<span class="${f === S.file ? "on" : ""}" data-open="${f}"><i style="background:${colorOf(f)}"></i>${f}</span>`).join("")}</div>
      <span class="sp"></span><a href="#">Install ↗</a><a href="#" data-reset>Reset</a></div>
    <div class="body">
      <div class="editor"><div class="bar"><span>${S.file}</span><span>·</span><span>hover a term, click a squiggle</span><span class="lat">⚡ ${S.lat} ms</span></div>${codeHTML(S.file)}</div>
      <div class="inspector">
        <div class="card"><h5>This file</h5>${here.map(d => `<div class="row" data-goto="${d.id}"><span class="dot" style="background:${d.sev === "error" ? "#f87171" : d.sev === "warning" ? "#fbbf24" : "#64748b"}"></span><span>${esc(d.msg)}</span>${d.fix ? `<span class="fix" data-fix="${d.id}">fix</span>` : ""}</div>`).join("") || `<div style="color:#8a93a6">Clean ✓</div>`}</div>
        <div class="card"><h5>Workspace</h5><div class="facts">
          <div><span class="bignum">${S.diags.length}</span><small>problems in ${new Set(S.diags.map(d => d.file)).size} files</small></div>
          <div><span class="bignum">${S.edits}</span><small>edits checked</small></div>
          <div><b>7</b><small>files · 5 formats</small></div><div><b>${S.renamed ? "ex:Human" : "ex:Person"}</b><small>class</small></div></div></div>
        <div class="card"><h5>Why it's fast</h5><div style="font-size:13px;color:#aab3c5">The same Rust server as the VS Code extension, compiled to WebAssembly and running in a Web Worker. Nothing leaves this tab.</div></div>
      </div>
    </div>
    <div class="chips">${TOUR.map((t, i) => `<button data-step="${i}" data-act="${t.act}">${["✏️", "🧩", "🔎", "⌨️", "❓", "🔁"][i]} ${t.t}</button>`).join("")}</div>
  </div>`;
}

// ===================== render & events =====================
const VARIANTS = { A: VariantA, B: VariantB, C: VariantC };
function render() {
  const v = variant();
  document.getElementById("app").innerHTML = VARIANTS[v]() + popupHTML() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : "");
  document.getElementById("vlabel").textContent = `${v} (${NAMES[v]})`;
  // Surface the state on every render, as the prototype rules ask.
  console.log("[prototype state]", { variant: v, file: S.file, focus: S.focus, step: S.step, diags: S.diags.map(d => d.id), renamed: S.renamed, lat: S.lat });
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-step],[data-act],[data-fix],[data-goto],[data-reset],.tok");
  if (!t) { if (S.popup && !e.target.closest(".popup")) { S.popup = null; render(); } return; }
  e.preventDefault();
  if (t.dataset.reset !== undefined) { S = fresh(); return render(); }
  if (t.dataset.fix) return applyFix(t.dataset.fix);
  if (t.dataset.goto) { const d = S.diags.find(x => x.id === t.dataset.goto); return open(d.file, d.line); }
  if (t.dataset.open) return open(t.dataset.open, null);
  if (t.dataset.step !== undefined && t.dataset.act !== undefined) { goStep(+t.dataset.step); return setTimeout(() => act(t.dataset.act), 30); }
  if (t.dataset.step !== undefined) return goStep(+t.dataset.step);
  if (t.dataset.act) return act(t.dataset.act);
  if (t.classList.contains("tok") || t.dataset.diag) return showHover(t);
});
document.addEventListener("mouseover", e => { const d = e.target.closest("[data-diag]"); if (d && (!S.popup || S.popup.kind !== "hover")) showHover(d); });
function cycle(dir) {
  const keys = ["A", "B", "C"], i = keys.indexOf(variant());
  const p = new URLSearchParams(location.search); p.set("variant", keys[(i + dir + keys.length) % keys.length]);
  history.replaceState(null, "", "?" + p); S.popup = null; render();
}
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); if (e.key === "Escape") { S.popup = null; render(); }
});
render();
</script>
</body>
