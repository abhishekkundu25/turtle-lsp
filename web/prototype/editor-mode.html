<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor mode (prototype)</title>
<!--
  PROTOTYPE, throwaway. Run: npm run web:prototype, then open
  http://127.0.0.1:4173/editor-mode.html?variant=A  (or B, C; the pink bar or the left/right arrow keys switch).

  Question: what should an EDITOR MODE of the RDF Toolbox look like, one that feels like VS Code
  (Monaco, files, tabs, problems, status bar, command palette, hover/peek/lightbulb) but is better
  than VS Code for RDF: run SPARQL on the input, SHACL as a live view, a graph of the resource under
  the cursor, a graph diff, a labels reading mode, an ontology health report, convert as a command.

  Variants (structurally different, same data, same Monaco providers):
    A  Workbench   - VS Code's own layout: activity bar, explorer, tabs, bottom panel (Problems,
                     Results, SHACL, Graph diff, Health), a graph side bar that follows the cursor.
    B  Inspector   - editor left, one inspector right that follows the cursor and changes with
                     context (a resource, a shape, a query, an update); a Workspace tab for overviews.
    C  Graph canvas - the graph is the main surface; the source opens in a drawer at the triple;
                     a SPARQL console at the bottom; SHACL / Health / Diff are lenses over the graph.

  REAL (captured from web/app/engine.wasm, turtle-lsp 0.5.0, on these exact texts and embedded below):
    diagnostics with their quick fixes, the formatter output and its guarantee, fix-all. Captured
    states: the initial input, each single quick fix, fix-all, and the update applied. Any other
    text is shown as STALE (this prototype does not run the engine live).
  MOCKED (written by the prototype, labelled MOCKED on screen): the toy Turtle/SPARQL parser and
    index behind hover, peek, graph, labels, health, graph diff, the SPARQL evaluator, the SHACL
    grid and "why" view, shape generation and the converter.
  No URL-shared state beyond ?variant= (shareable links were rejected).
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23ff2d78%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22monospace%22 font-size=%2212%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3Ettl%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5f8;--panel:#fff;--panel-hd:#fafbfc;--line:#dde1e8;--line-soft:#e6e9ef;--tx:#1d2330;--muted:#5d6675;--faint:#9aa3b2;--acc:#2557d6;--on-acc:#fff;--chip:#eef1f6;--bad-bg:#fde8e8;--bad-tx:#b42318;--ok-bg:#e3f6e8;--ok-tx:#1a7f37;--warn-bg:#fff4d6;--warn-tx:#6b4500;--add-bg:#e3f6e8;--del-bg:#fde8e8;--cur-bg:#fff6cc;--iri:#1f56c2;--str:#0a7a3e;--var:#8a2bb3;--act:#e9ecf2;--sel:rgba(37,87,214,.1);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--panel:#1a1e26;--panel-hd:#1f242d;--line:#2d333f;--line-soft:#272c36;--tx:#e4e7ee;--muted:#a2aab8;--faint:#6d7584;--acc:#6b93ff;--on-acc:#0d1018;--chip:#262b35;--bad-bg:#3a1d1f;--bad-tx:#ff9b94;--ok-bg:#16301f;--ok-tx:#7ddc96;--warn-bg:#3a2f12;--warn-tx:#f4cf75;--add-bg:#16301f;--del-bg:#3a1d1f;--cur-bg:#3a3415;--iri:#8fb2ff;--str:#7ddc96;--var:#d39cf2;--act:#161a21;--sel:rgba(107,147,255,.16);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--panel:#1a1e26;--panel-hd:#1f242d;--line:#2d333f;--line-soft:#272c36;--tx:#e4e7ee;--muted:#a2aab8;--faint:#6d7584;--acc:#6b93ff;--on-acc:#0d1018;--chip:#262b35;--bad-bg:#3a1d1f;--bad-tx:#ff9b94;--ok-bg:#16301f;--ok-tx:#7ddc96;--warn-bg:#3a2f12;--warn-tx:#f4cf75;--add-bg:#16301f;--del-bg:#3a1d1f;--cur-bg:#3a3415;--iri:#8fb2ff;--str:#7ddc96;--var:#d39cf2;--act:#161a21;--sel:rgba(107,147,255,.16);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel);color:var(--muted)}
.mock,.real,.stale{display:inline-block;font:700 9px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.mock{background:#fde68a;color:#713f12}.real{background:#bbf7d0;color:#14532d}.stale{background:#e5e7eb;color:#374151}
.empty{color:var(--faint);padding:10px 12px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 9px;font-size:12px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.sm{padding:1px 7px;font-size:11.5px}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 4px;font-size:12px}
.lnk{border:0;background:none;padding:0;color:var(--iri);font:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--iri) 35%,transparent);text-underline-offset:2px}
.lnk.mono{font-family:var(--mono);font-size:12px}
.lit{color:var(--str);font-family:var(--mono);font-size:12px}
.unb{color:var(--faint)}
.sev{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font:700 10px system-ui;flex:0 0 15px}
.sev.e{background:#e5484d;color:#fff}.sev.w{background:#e29a12;color:#fff}.sev.i,.sev.h{background:var(--faint);color:#fff}
.chipc{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:9px;background:var(--chip);color:var(--muted);line-height:16px}
.chipc.bad{background:var(--bad-bg);color:var(--bad-tx)}.chipc.ok{background:var(--ok-bg);color:var(--ok-tx)}.chipc.warn{background:var(--warn-bg);color:var(--warn-tx)}

/* shared content widgets (not layout) */
.plist .pf{font-weight:600;font-size:12px;padding:6px 12px 2px;display:flex;gap:6px;align-items:center}
.prow{display:flex;gap:8px;align-items:flex-start;padding:3px 12px 3px 22px;font-size:12.5px}
.prow:hover{background:var(--sel)}
.prow .m{flex:1;min-width:0;overflow-wrap:anywhere}
.prow .c{color:var(--faint);font-family:var(--mono);font-size:11px}
.fixes{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
table.res{border-collapse:collapse;width:100%;font-size:12.5px}
table.res th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 10px;position:sticky;top:0;background:var(--panel);font-family:var(--mono);font-size:11.5px}
table.res td{border-bottom:1px solid var(--line-soft);padding:4px 10px;vertical-align:top}
table.res td.n{color:var(--faint);width:28px;text-align:right}
.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th{font-weight:600;color:var(--muted);padding:4px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:11px;vertical-align:bottom}
.grid th.rh{text-align:left}
.grid td{padding:3px 6px;text-align:center;border-bottom:1px solid var(--line-soft)}
.grid td.rh{text-align:left;white-space:nowrap}
.cell{border:1px solid transparent;border-radius:5px;min-width:30px;padding:2px 6px;font-weight:700;background:none}
.cell.ok{color:var(--ok-tx);background:var(--ok-bg)}.cell.fail{color:var(--bad-tx);background:var(--bad-bg)}.cell.na{color:var(--faint)}
.cell.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--sel)}
.why{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.why .side{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.why .side h4{margin:0;padding:5px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel-hd);border-bottom:1px solid var(--line-soft);display:flex;gap:6px}
.why pre{margin:0;padding:6px 9px;font:12px/18px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.why pre .hit{background:var(--bad-bg);color:var(--bad-tx);border-radius:3px}
.why pre .rule{background:var(--sel);border-radius:3px}
.verdict{grid-column:1/-1;font-size:12.5px;padding:6px 9px;border-radius:7px;background:var(--bad-bg);color:var(--bad-tx)}
.verdict.ok{background:var(--ok-bg);color:var(--ok-tx)}
.tdiff{font:12px/18px var(--mono)}
.tdiff div{padding:1px 10px;display:flex;gap:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.tdiff .a{background:var(--add-bg)}.tdiff .d{background:var(--del-bg)}
.tdiff .loc{margin-left:auto;color:var(--faint);font-size:11px;white-space:nowrap}
.hsec{margin:0 0 12px}
.hsec h4{margin:0 0 4px;font-size:12px;display:flex;gap:6px;align-items:center}
.hsec ul{margin:0;padding:0 0 0 2px;list-style:none}
.hsec li{padding:1px 0;font-size:12.5px}
.ctree ul{list-style:none;margin:0;padding-left:16px}
.ctree>ul{padding-left:0}
.ctree li{padding:2px 0}
svg.g text{font:11px system-ui,sans-serif;fill:var(--tx);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.c-canvas svg.g text{stroke:var(--bg)}
svg.g .el{font-size:10px;fill:var(--muted)}
svg.g .lt{font-family:var(--mono);font-size:10.5px;fill:var(--str)}
svg.g line,svg.g path.e{stroke:var(--faint);stroke-width:1.2;fill:none}
svg.g .edge{cursor:pointer}
svg.g .edge:hover line{stroke:var(--acc);stroke-width:2}
svg.g .edge.add line{stroke:#2fa84f;stroke-width:2.2}
svg.g .edge.del line{stroke:#e5484d;stroke-width:2;stroke-dasharray:4 3}
svg.g circle.n{fill:var(--panel);stroke:var(--acc);stroke-width:1.6}
svg.g circle.n.c{fill:var(--acc)}
svg.g circle.n.wk{stroke:var(--faint)}
svg.g .node{cursor:pointer}
svg.g .node:hover circle.n{stroke-width:3}
svg.g circle.ring{fill:none;stroke:#e5484d;stroke-width:2.5}
svg.g circle.ring.h{stroke:#e29a12;stroke-dasharray:3 2}
svg.g rect.lb{fill:var(--panel);stroke:var(--line);rx:4}
.lbl-chip{background:var(--sel);color:var(--acc)!important;border-radius:3px;padding:0 3px;margin-right:2px;font-family:system-ui,sans-serif;font-style:normal}
.lbl-chip.fb{color:var(--warn-tx)!important;background:var(--warn-bg)}
.lbl-iri{opacity:.3}

/* palette + toast + prototype bar (the bar is not part of the design) */
#pal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.18)}
#pal .box{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:11px 14px;background:transparent;outline:none;font-size:14px}
#pal .list{max-height:52vh;overflow:auto;padding:4px 0}
#pal .it{display:flex;gap:8px;padding:5px 14px;font-size:13px;cursor:pointer}
#pal .it.on{background:var(--sel)}
#pal .it .k{margin-left:auto;color:var(--faint);font-size:11.5px}
#pal .it .grp{color:var(--faint);min-width:72px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:2001;background:#111;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;max-width:calc(100vw - 32px)}
#pbar{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:3000;display:flex;align-items:center;gap:4px;background:#ff2d78;color:#fff;border-radius:999px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.35);font:600 12.5px system-ui,sans-serif;white-space:nowrap;max-width:calc(100vw - 24px)}
#pbar button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:999px;min-width:30px;height:30px;padding:0 10px;font:600 12.5px system-ui,sans-serif}
#pbar .lbl{padding:0 4px}
#pbar .st{font-weight:500;opacity:.92;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
#pstate{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:3000;width:min(560px,calc(100vw - 24px));max-height:46vh;overflow:auto;background:#111;color:#a7f3d0;font:11px/1.45 var(--mono);padding:10px 12px;border-radius:10px;margin:0;white-space:pre-wrap;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#boot{padding:40px;color:var(--muted)}

/* ================== A: Workbench ================== */
.vA{display:grid;grid-template-rows:34px minmax(0,1fr) 24px;height:100vh;max-width:100vw;overflow:hidden}
.a-title{overflow:hidden;white-space:nowrap}
.a-title{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel-hd);border-bottom:1px solid var(--line);font-size:12.5px}
.a-logo{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--tx);color:var(--bg);font:700 9px var(--mono)}
.a-cmd{flex:0 1 460px;margin:0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;color:var(--muted);font-size:12px;min-width:0}
.a-cmd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-cmd kbd{margin-left:auto}
.a-body{display:grid;grid-template-columns:44px 248px minmax(0,1fr) 330px;min-height:0}
.a-act{background:var(--act);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
.a-act button{width:36px;height:36px;border:0;background:none;color:var(--faint);font-size:17px;border-left:2px solid transparent;border-radius:0;position:relative}
.a-act button.on{color:var(--tx);border-left-color:var(--acc)}
.a-act button .b{position:absolute;right:2px;bottom:4px;font:700 9px system-ui;background:var(--acc);color:var(--on-acc);border-radius:7px;padding:0 4px;line-height:13px}
.a-side{background:var(--panel-hd);border-right:1px solid var(--line);overflow:auto;min-width:0}
.a-sh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px 6px;display:flex;gap:6px;align-items:center}
.a-grp{font-size:11px;font-weight:700;color:var(--muted);padding:6px 12px 2px;text-transform:uppercase;letter-spacing:.04em}
.a-file{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:3px 12px 3px 20px;font-size:12.5px;text-align:left}
.a-file:hover{background:var(--sel)}
.a-file.on{background:var(--sel);box-shadow:inset 2px 0 var(--acc)}
.a-file .ic{font:700 9px var(--mono);color:var(--muted);width:24px}
.a-file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-center{display:grid;grid-template-rows:33px 24px minmax(0,1fr) 270px;min-width:0;min-height:0}
.a-tabs{display:flex;background:var(--panel-hd);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.a-tab{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border:0;border-right:1px solid var(--line-soft);background:none;font-size:12.5px;color:var(--muted);white-space:nowrap;height:33px}
.a-tab.on{background:var(--panel);color:var(--tx);box-shadow:inset 0 1px var(--acc)}
.a-tab .x{color:var(--faint);padding:0 2px;font-size:13px}
.a-tab .ic{font:700 9px var(--mono);color:var(--faint)}
.a-crumbs{display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12px;color:var(--muted);background:var(--panel);overflow:hidden;white-space:nowrap}
.a-crumbs .sep{color:var(--faint)}
.a-ed{min-height:0;background:var(--panel)}
.a-panel{display:grid;grid-template-rows:30px minmax(0,1fr);border-top:1px solid var(--line);background:var(--panel);min-height:0}
.a-ptabs{display:flex;gap:2px;padding:0 10px;align-items:stretch;overflow-x:auto}
.a-ptab{border:0;background:none;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 8px;border-bottom:1px solid transparent;white-space:nowrap;display:flex;gap:5px;align-items:center}
.a-ptab.on{color:var(--tx);border-bottom-color:var(--acc)}
.a-pbody{overflow:auto;min-height:0}
.a-right{border-left:1px solid var(--line);background:var(--panel-hd);display:flex;flex-direction:column;min-width:0;overflow:auto}
.a-seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.a-seg button{border:0;background:var(--panel);font-size:11px;padding:2px 8px;color:var(--muted)}
.a-seg button.on{background:var(--acc);color:var(--on-acc)}
.a-status{display:flex;align-items:center;gap:2px;background:var(--acc);color:var(--on-acc);font-size:11.5px;padding:0 6px;overflow:hidden;white-space:nowrap}
.a-status button{border:0;background:none;color:inherit;padding:0 7px;height:24px;font-size:11.5px}
.a-status button:hover{background:rgba(255,255,255,.15)}
.a-split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px;padding:8px 12px}
@media (max-width:900px){#a-lbl,.a-title .unb{display:none}.a-body{grid-template-columns:44px minmax(0,1fr)}.a-side,.a-right{display:none}.a-center{grid-template-rows:33px 24px minmax(0,1fr) 220px}.a-cmd kbd{display:none}.a-split{grid-template-columns:1fr}.a-status .opt{display:none}}

/* ================== B: Inspector ================== */
.vB{display:grid;grid-template-rows:52px minmax(0,1fr) 26px;height:100vh;background:var(--bg)}
.b-top{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.b-logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--tx);color:var(--bg);font:700 11px var(--mono)}
.b-pills{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1;padding:4px 0}
.b-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font:12px var(--mono);white-space:nowrap}
.b-pill.on{border-color:var(--acc);background:var(--sel);color:var(--acc)}
.b-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(400px,1fr);gap:12px;padding:12px;min-height:0}
.b-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.b-edhd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px;flex-wrap:wrap}
.b-edhd b{font-family:var(--mono)}
#b-ed{flex:1;min-height:0}
.b-ribbon{border-top:1px solid var(--line-soft);padding:6px 12px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel-hd)}
.b-ihd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.b-tg{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.b-tg.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.b-ibody{overflow:auto;flex:1;padding:12px;min-height:0}
.b-hero{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.b-hero h2{margin:0;font-size:19px}
.b-hero .iri{font:12px var(--mono);color:var(--muted)}
.b-sec{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.b-sec>h3{margin:0;padding:7px 10px;font-size:12.5px;display:flex;gap:8px;align-items:center;background:var(--panel-hd);border-bottom:1px solid var(--line-soft)}
.b-sec>.bd{padding:8px 10px}
.b-toc{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;position:sticky;top:-12px;background:var(--panel);padding:6px 0;z-index:1}
.b-foot{display:flex;align-items:center;gap:14px;padding:0 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow:hidden}
@media (max-width:900px){.vB{height:auto;min-height:100vh}.b-main{grid-template-columns:minmax(0,1fr)}.b-card.ed{height:55vh}.b-card.insp{min-height:60vh}.b-top .hide-s{display:none}}

/* ================== C: Graph canvas ================== */
.vC{display:grid;grid-template-rows:54px minmax(0,1fr) 240px;grid-template-columns:232px minmax(0,1fr) 470px;height:100vh;background:var(--bg)}
.c-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.c-logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on-acc);font:700 11px var(--mono)}
.c-q{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--muted);font-size:13px;min-width:0;cursor:text}
.c-q span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-out{grid-row:2;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px 0}
.c-out h5{margin:10px 12px 3px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.c-it{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:2px 12px;font-size:12.5px;text-align:left;min-width:0}
.c-it:hover{background:var(--sel)}
.c-it.on{background:var(--sel);color:var(--acc);font-weight:600}
.c-it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-it.sub{padding-left:24px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--faint)}
.dot.bad{background:#e5484d}.dot.h{background:#e29a12}
.c-canvas{grid-row:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle,var(--line-soft) 1px,transparent 1.2px) 0 0/22px 22px,var(--bg)}
.c-canvas svg{position:absolute;inset:0;width:100%;height:100%}
.c-lens{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.c-seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.c-seg button{border:0;background:none;padding:4px 10px;font-size:12px;color:var(--muted)}
.c-seg button.on{background:var(--tx);color:var(--bg)}
.c-seg .t{padding:4px 8px;font-size:11px;color:var(--faint);align-self:center}
.c-focus{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:300px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.c-focus h3{margin:0;font-size:15px}
.c-card{position:absolute;left:12px;bottom:12px;max-width:min(560px,calc(100% - 24px));max-height:55%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:2}
.c-card>h4{margin:0;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel)}
.c-card>.bd{padding:8px 12px}
.c-card.min{max-height:none;cursor:pointer}.c-card.min>h4{border-bottom:0}
.c-drawer{grid-row:2/4;grid-column:3;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0;box-shadow:-8px 0 24px rgba(0,0,0,.05)}
.c-dhd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:12px;flex-wrap:wrap}
.c-ftabs{display:flex;gap:2px;overflow-x:auto;padding:0 8px;border-bottom:1px solid var(--line-soft)}
.c-ftab{border:0;background:none;padding:5px 8px;font:12px var(--mono);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.c-ftab.on{color:var(--tx);border-bottom-color:var(--acc)}
#c-ed{flex:1;min-height:0}
.c-con{grid-row:3;grid-column:1/3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);border-top:1px solid var(--line);background:var(--panel);min-height:0}
.c-con .q{display:flex;flex-direction:column;border-right:1px solid var(--line-soft);min-height:0}
.c-con .qh{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line-soft);font-size:12px}
#c-qed{flex:1;min-height:0}
.c-con .r{overflow:auto;min-height:0}
@media (max-width:900px){.c-q kbd,#c-lbl,.c-top b{display:none}.vC{grid-template-columns:minmax(0,1fr);grid-template-rows:54px 46vh 60vh 300px;height:auto}.c-out{display:none}.c-canvas{grid-row:2}.c-drawer{grid-row:3;grid-column:1}.c-con{grid-row:4;grid-column:1;grid-template-columns:1fr}.c-con .r{display:none}.c-focus{display:none}}
</style>
</head>

/* graph of the resource under the cursor (MOCKED index) */
function graphSVG(t, o = {}) {
  const W = o.w || 320, H = o.h || 300, cx = W / 2, cy = H / 2, r1 = o.r1 || Math.min(W, H) / 2 - 58;
  const out = IDX.triples.filter(x => x.s === t), inn = IDX.triples.filter(x => x.o === t && !x.lit);
  if (!t || (!out.length && !inn.length)) return `<div class="empty">${t ? `<span class="mono">${esc(t)}</span> has no triples in the input.` : "Put the cursor on a resource."}</div>`;

    const fl = failing(), items = [...out.map(x => ({ tr: x, n: x.o, lit: x.lit, dir: 1 })), ...inn.map(x => ({ tr: x, n: x.s, dir: -1 }))];

    let E = "", N = "";

      const y = 10 + gap / 2 + k * gap, lb = p.lit ? trunc(litParts(p.n).text + (litParts(p.n).lang ? "@" + litParts(p.n).lang : ""), 22) : p.n.startsWith("_:") ? "[ ]" : trunc(disp(p.n), 22);
      const [x1, y1, x2, y2] = p.dir > 0 ? [cx, cy, nx, y] : [nx, y, cx, cy];
      E += `<g class="edge" data-act="jumpl" data-arg="${esc(p.tr.file)}|${p.tr.line}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#ah)"/><text class="el" x="${nx - 12}" y="${y - 5}" text-anchor="end">${p.dir < 0 ? "← " : ""}${esc(trunc(p.tr.p === "rdf:type" ? "a" : disp(p.tr.p), 18))}</text><title>${esc(p.tr.file)}:${p.tr.line} — click to jump to the triple</title></g>`;
      N += p.lit ? `<g><circle cx="${nx}" cy="${y}" r="3" fill="var(--str)"/><text class="lt" x="${nx + 9}" y="${y + 4}">${esc(lb)}</text></g>`
        : `<g class="node" data-act="jumpt" data-arg="${esc(p.tr.file)}|${p.tr.line}|${esc(p.n)}">${fl.has(p.n) ? `<circle class="ring" cx="${nx}" cy="${y}" r="10"/>` : ""}<circle class="n ${wk(p.n) ? "wk" : ""}" cx="${nx}" cy="${y}" r="5.5"/><text x="${nx + 10}" y="${y + 4}">${esc(lb)}</text><title>${esc(p.n)}</title></g>`;
    });
    return `<svg class="g" viewBox="0 0 ${W} ${H2}" width="${W}" height="${H2}"><defs><marker id="ah" viewBox="0 0 10 10" refX="15" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--faint)"/></marker></defs>${E}${N}${fl.has(t) ? `<circle class="ring" cx="${cx}" cy="${cy}" r="14"/>` : ""}<circle class="n c" cx="${cx}" cy="${cy}" r="9"><title>${esc(t)}</title></circle></svg>`;
  }

  const place = (list, a0, a1) => list.map((x, k) => ({ ...x, a: list.length === 1 ? (a0 + a1) / 2 : a0 + (a1 - a0) * k / (list.length - 1) }));
  const outs = out.map(x => ({ tr: x, n: x.o, lit: x.lit, dir: 1 })).concat(delE.filter(x => x.s === t).map(x => ({ tr: x, n: x.o, lit: x.lit, dir: 1, del: true })));
  const ins = inn.map(x => ({ tr: x, n: x.s, dir: -1 })).concat(delE.filter(x => x.o === t).map(x => ({ tr: x, n: x.s, dir: -1, del: true })));

  const nodeG = (n, x, y, a, lit, extra = "") => {
    const anc = Math.cos(a) > 0.3 ? "start" : Math.cos(a) < -0.3 ? "end" : "middle", dx = anc === "start" ? 10 : anc === "end" ? -10 : 0, dy = anc === "middle" ? (Math.sin(a) > 0 ? 18 : -10) : 4;
    if (lit) return `<g><text class="lt" x="${x + dx}" y="${y + dy}" text-anchor="${anc}">${esc(label(n))}</text><circle cx="${x}" cy="${y}" r="3" fill="var(--str)"/></g>`;
    const ring = (fails?.has(n) ? `<circle class="ring" cx="${x}" cy="${y}" r="11"/>` : "") + (hm?.has(n) ? `<circle class="ring h" cx="${x}" cy="${y}" r="14"/>` : "");

    N += nodeG(p.n, x, y, p.a, p.lit, `data-act="jumpt" data-arg="${esc(p.tr.file)}|${p.tr.line}|${esc(p.n)}"`);

        N += `<g opacity=".8">${nodeG(n2, x2, y2, a2, s2.lit, s2.lit ? "" : `data-act="jumpt" data-arg="${esc(s2.file)}|${s2.line}|${esc(n2)}"`)}</g>`;

}

function termAt(model, pos) {
  const w = model.getWordAtPosition(pos); if (!w) return null;
  if (/^(?:[A-Za-z][\w-]*)?:[\w-]+$/.test(w.word)) return { t: w.word, range: { startLineNumber: pos.lineNumber, endLineNumber: pos.lineNumber, startColumn: w.startColumn, endColumn: w.endColumn } };

    case "run": return runQuery(isQ(S.active) ? S.active : S.query);
    case "applyupd": return applyUpdate();
    case "discard": { S.result = null; return refresh() }
    case "panel": { S.panel = arg; return refresh() }
    case "side": { S.side = arg; return refresh() }
    case "insp": { S.insp = arg; if (el?.dataset.anchor) B.anchor = el.dataset.anchor; return refresh() }
    case "anchor": { B.anchor = arg; return refresh() }
    case "lens": { S.lens = arg; S.cardOpen = false; return refresh() }
    case "card": { S.cardOpen = !S.cardOpen; return refresh() }
    case "gmode": { S.gmode = arg; return refresh() }
    case "diffmode": { S.diffMode = arg; V().show("diff"); return refresh() }
    case "labels": return toggleLabels();
    case "palette": return openPalette();
    case "genshapes": return genShapes();
    case "format": return formatDoc(S.v === "C" ? nameOf(C.ed.getModel()) : S.active);
  }
}
document.addEventListener("click", e => {
  const pi = e.target.closest("[data-pal]"); if (pi) return runCmd(+pi.dataset.pal);
  const sw = e.target.closest("[data-sw]");
  if (sw) { const k = sw.dataset.sw; if (k === "state") { S.stateOpen = !S.stateOpen; return drawBar() } return setV(KEYS[(KEYS.indexOf(S.v) + (+k) + 3) % 3]) }
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  e.stopPropagation(); act(el.dataset.act, el.dataset.arg, el);
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset?.act;
  if (a === "labels") { S.labels = el.checked; refresh() }
  else if (a === "lang") { S.lang = el.value; S.labels = true; refresh() }
  else if (a === "convert" && el.value) convert(el.value, S.v === "C" ? nameOf(C.ed.getModel()) : S.active);
  else if (a === "query") { S.query = el.value; C.qed.setModel(M[el.value]); refresh() }
});
document.addEventListener("keydown", e => {
  const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "p") { e.preventDefault(); return openPalette() }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && !typing) { e.preventDefault(); return openPalette() }
  if (typing || S.pal) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") setV(KEYS[(KEYS.indexOf(S.v) + (e.key === "ArrowRight" ? 1 : 2)) % 3]);
});

const BASEURL = "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min";
window.MonacoEnvironment = { getWorkerUrl: () => "data:text/javascript;charset=utf-8," + encodeURIComponent(`self.MonacoEnvironment={baseUrl:'${BASEURL}/'};importScripts('${BASEURL}/vs/base/worker/workerMain.js');`) };
require.config({ paths: { vs: BASEURL + "/vs" } });
require(["vs/editor/editor.main"], () => {
  setupMonaco(); buildIndex();
  const q = new URLSearchParams(location.search).get("variant")?.toUpperCase();
  S.v = KEYS.includes(q) ? q : "A";
  render(); reanalyse();
  console.log("[prototype] variant →", stateObj());
});
</script>
