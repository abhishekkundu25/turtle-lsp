# Weekly updates for dependencies and for the pinned GitHub Actions SHAs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo: { patterns: ["*"] }
  # The browser engine has its own Cargo.lock.
  - package-ecosystem: cargo
    directory: /web/engine
    schedule: { interval: weekly }
    groups:
      cargo-web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      test-tooling: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule: { interval: weekly }
    # Must not be newer than engines.vscode in package.json, or vsce refuses to
    # package. Raise both together by hand.
    ignore:
      - dependency-name: "@types/vscode"
    groups:
      vscode-extension: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
