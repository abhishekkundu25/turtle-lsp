name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly on main: the Tests, VS Code and Browser jobs with the shipped
  # release profile (fat LTO), the chaos tests with a new seed, and the
  # dependency audit, so a new advisory shows up here first.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Read-only by default; no job here needs to write anything.
permissions:
  contents: read

# @vscode/test-web depends on Playwright's Chromium, which its install script
# would download in every job that installs editors/vscode; the tests use the
# runner's Google Chrome. (package.json's allowScripts denies it too.)
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# A new push to a pull request supersedes the run before it (one group per
# pull request, in progress canceled). A push to main gets a group of its own
# commit: in a shared group GitHub cancels a *pending* run when a newer one
# queues, whatever cancel-in-progress says, and the release waits for the CI
# run of its tagged commit (release.yml, job "ci"), which a canceled run fails.
# A scheduled or manual run gets a group of its own run, so it never shares the
# group of a push to the same commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.event_name == 'push' && github.sha || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (tags can be moved); Dependabot bumps them.
#
# Release profile: the native build, Rust test and chaos jobs build without fat
# LTO on PRs and main pushes (the CARGO_PROFILE_RELEASE_* variables below),
# which takes minutes off every build and test link. The nightly run keeps the
# shipped profile (Cargo.toml), as do the Performance job and release.yml.
#
# Caches: only a push to main saves caches. Pull requests restore main's, so
# storage stays under the 10 GB limit and main's warm caches are not evicted.
jobs:
  # Classifies PR changes for non-gating installer checks (always true on main,
  # nightly and manual runs).
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install_action: ${{ steps.filter.outputs.install_action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "install_action=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "install_action=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(action\.yml|install\.sh|install\.ps1)$'; then
            echo "install_action=true" >> "$GITHUB_OUTPUT"
          else
            echo "install_action=false" >> "$GITHUB_OUTPUT"
          fi

  # Formatting on Linux; clippy on every OS, as there is cfg(windows) code.
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the compiler pinned in rust-toolchain.toml.
      - run: rustup toolchain install
        timeout-minutes: 5
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path web/engine/Cargo.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo clippy --release --locked --all-targets -- -D warnings
        timeout-minutes: 10

  # Per-OS native binary producers: each OS builds turtle-lsp once and hands it
  # to its own Node, VS Code and (on Linux) Browser parity consumers without
  # making Linux or macOS wait for Windows.
  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'schedule' && 'fat' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'schedule' && '1' || '16' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          artifact: turtle-lsp-linux

  build-macos:
    name: Build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'schedule' && 'fat' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'schedule' && '1' || '16' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          artifact: turtle-lsp-macos

  build-windows:
    name: Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'schedule' && 'fat' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'schedule' && '1' || '16' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          artifact: turtle-lsp-windows

  # Rust library, integration, timing and doc tests on every OS (starts at T=0;
  # saves the shared per-OS Rust dependency cache on main). Extended chaos runs
  # in parallel in the `chaos` job below; macOS runs mutated_* here at default
  # counts.
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'schedule' && 'fat' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'schedule' && '1' || '16' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/fetch-corpus
        with:
          save-cache: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      # The test binaries: the lib, the integration tests and nothing else
      # (`--bins` would link main.rs although it has `test = false`; the
      # examples are type-checked by clippy).
      - run: cargo test --release --locked --lib --tests --no-run
        timeout-minutes: 25
      # The wall-clock lib tests (named timing_*) run in the next step on their
      # own. The mutation loops (mutated_*) run in the chaos job below, which
      # macOS does not have, so macOS runs them here at their default counts.
      - name: Tests
        timeout-minutes: 5
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo test --release --locked --lib --tests -- --skip timing_
          else
            cargo test --release --locked --lib --tests -- --skip timing_ --skip mutated_
          fi
      - name: Timing tests, one at a time
        timeout-minutes: 5
        run: cargo test --release --locked --lib -- timing_ --test-threads=1
      # The public-interface list in src/lib.rs.
      - run: cargo test --release --locked --doc
        timeout-minutes: 10
      # What the integration tests left under target/tmp, to read a failure that
      # does not reproduce locally.
      - name: Keep the test folders of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-tmp-${{ matrix.os }}
          path: target/tmp
          if-no-files-found: ignore
          retention-days: 7

  # The mutation loops at 30,000 iterations with the fixed seeds, split into
  # two parallel shards (`xml` and everything else) so chaos runs beside Rust
  # tests instead of after them. Not on macOS: Windows' stack frames are the
  # OS-specific signal, and macOS adds little to Linux.
  # Nightly: a new seed (the run id) and 200,000 iterations.
  chaos:
    name: Chaos (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'schedule' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [xml, core]
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'schedule' && 'fat' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'schedule' && '1' || '16' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - uses: ./.github/actions/fetch-corpus
      - run: cargo test --release --locked --test chaos --no-run
        timeout-minutes: 15
      - name: Chaos test, longer run
        timeout-minutes: ${{ github.event_name == 'schedule' && 20 || 5 }}
        shell: bash
        env:
          CHAOS_ITERS: ${{ github.event_name == 'schedule' && '200000' || '30000' }}
          CHAOS_SEED: ${{ github.event_name == 'schedule' && github.run_id || '' }}
          MATRIX_OS: ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$CHAOS_SEED" ]; then
            echo "CHAOS_SEED=$CHAOS_SEED CHAOS_ITERS=$CHAOS_ITERS ($MATRIX_OS, $SHARD)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SHARD" = "xml" ]; then
            cargo test --release --locked --test chaos -- mutated_rdfxml_ mutated_owlxml_
          else
            cargo test --release --locked --test chaos -- mutated_ --skip mutated_rdfxml_ --skip mutated_owlxml_
          fi
      - name: Keep the test folders of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-tmp-${{ matrix.os }}-${{ matrix.shard }}
          path: target/tmp
          if-no-files-found: ignore
          retention-days: 7

  # Node LSP, Neovim and memory-budget tests consuming each OS's prebuilt binary.
  node-linux:
    name: Node and Neovim (ubuntu-latest)
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-node-tests
        with:
          artifact: turtle-lsp-linux

  node-macos:
    name: Node and Neovim (macos-latest)
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-node-tests
        with:
          artifact: turtle-lsp-macos

  node-windows:
    name: Node and Neovim (windows-latest)
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-node-tests
        with:
          artifact: turtle-lsp-windows

  # Desktop VS Code extension tests consuming each OS's prebuilt binary.
  vscode-linux:
    name: VS Code extension (ubuntu-latest)
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-vscode-tests
        with:
          artifact: turtle-lsp-linux

  vscode-macos:
    name: VS Code extension (macos-latest)
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-vscode-tests
        with:
          artifact: turtle-lsp-macos

  vscode-windows:
    name: VS Code extension (windows-latest)
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-vscode-tests
        with:
          artifact: turtle-lsp-windows

  # The oldest compiler Cargo.toml claims (rust-version; its comment says why).
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every rustc and cargo call in the job, rust-cache's included, uses 1.99.0
    # instead of rust-toolchain.toml's compiler.
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo +1.99.0 check --locked --all-targets
        timeout-minutes: 10

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vulnerable crates, licences, banned crates, crate sources (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # The browser engine has its own lock file (web/engine/Cargo.lock) and the
      # same rules. It depends on the server by path, which deny.toml's
      # `wildcards = "deny"` rejects unless path dependencies are allowed: the
      # copy below adds that one line (not needed once deny.toml has it).
      - name: deny.toml for web/engine
        run: |
          if grep -q '^allow-wildcard-paths' deny.toml; then
            cp deny.toml deny-web.toml
          else
            awk '{ print } /^\[bans\]$/ { print "allow-wildcard-paths = true" }' deny.toml > deny-web.toml
          fi
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: web/engine/Cargo.toml
          arguments: --all-features --config deny-web.toml
      # spareval is vendored with a patch; the copy must be the release plus
      # that patch and nothing else (and spareval = "0.2" must not resolve to a
      # newer release unnoticed).
      - name: vendor/spareval is spareval 0.2.7 plus its patch
        run: tools/check-vendor.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      # data/vocab.tsv must be what the pinned sources of data/vocab-sources.tsv
      # and the corrections give. The downloads are cached under the manifest's
      # hash (saved on main only), so a run that does not change it downloads
      # nothing; the nightly run downloads every source again (-f), so a
      # publisher's change to an unversioned file fails it first.
      - id: vocab-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/vocab-sources
          key: vocab-sources-${{ hashFiles('data/vocab-sources.tsv') }}
      - name: data/vocab.tsv is what its pinned sources give
        shell: bash
        timeout-minutes: 10
        env:
          FORCE: ${{ github.event_name == 'schedule' && '-f' || '' }}
        run: |
          # One retry, and only of a failed download (status 3): w3.org and the
          # other hosts throttle runners now and then. A changed hash or a list
          # that differs fails at once. The retry runs without -f: it downloads
          # only what the first run did not verify.
          status=0
          tools/check-vocab.sh $FORCE || status=$?
          if [ "$status" -eq 3 ]; then
            sleep 15
            tools/check-vocab.sh
          else
            exit "$status"
          fi
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.vocab-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/vocab-sources
          key: vocab-sources-${{ hashFiles('data/vocab-sources.tsv') }}
      # The extension ships only its runtime dependencies; dev tools stay local.
      - working-directory: editors/vscode
        run: npm audit --omit=dev --audit-level=moderate
      # The site ships Monaco and monaco-vim from the root tree, where they are
      # devDependencies: --omit=dev would audit nothing here.
      - run: npm audit --audit-level=moderate

  # Builds the WebAssembly browser engine (with its own release profile and
  # gzip size budget), clips it, and uploads web/app for parallel test jobs.
  web-build:
    name: Browser build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compiler pinned in rust-toolchain.toml, with the browser target.
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web/engine
          shared-key: web-engine
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        timeout-minutes: 5
      # The engine for wasm32 (web/app/engine.wasm), then Monaco beside the pages.
      # It keeps its own profile (web/engine/Cargo.toml), which its size budget
      # in web/build.mjs assumes.
      - run: node web/build.mjs
        timeout-minutes: 15
      - run: cargo clippy --locked -- -D warnings
        working-directory: web/engine
        timeout-minutes: 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: web/app
          if-no-files-found: error
          retention-days: 1

  # Engine parity tests against the prebuilt native binary, VS Code for the Web
  # and the required browser server-worker tests.
  web-engine:
    name: Browser engine & VS Code Web
    needs: [web-build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: web/app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turtle-lsp-linux
          path: target/release
      - shell: bash
        run: chmod +x target/release/turtle-lsp
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      # Engine parity tests (run once here; excluded from web-browser below).
      - name: Engine tests (no browser)
        timeout-minutes: 5
        run: >-
          node --test --test-force-exit --test-timeout=60000
          web/test/engine.test.mjs web/test/host.test.mjs
          web/test/jsonld-engine.test.mjs web/test/lsp.test.mjs
      - run: npx playwright-core install chrome
        timeout-minutes: 5
      # The extension's browser entry in VS Code for the Web, with the engine
      # built above, in the same Google Chrome.
      - name: VS Code for the Web
        working-directory: editors/vscode
        timeout-minutes: 5
        run: npm ci && npm run build && npm run test:web
      # The worker tests drive the server worker on the engine built above;
      # the desktop VS Code jobs have no engine, so they skip there and must run here.
      - name: Server worker tests
        working-directory: editors/vscode
        timeout-minutes: 3
        env:
          TURTLE_REQUIRE_ENGINE: "1"
        run: node --test --test-timeout=60000 test/web-worker.test.mjs

  # Browser UI tests (toolbox, editor, CSP, graph), dynamically balanced across
  # two parallel runners with the four engine-only files excluded so every test
  # file runs exactly once.
  web-browser:
    name: Browser UI tests (shard ${{ matrix.shard }}/2)
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: web/app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - run: npx playwright-core install chrome
        timeout-minutes: 5
      # Two files at a time per runner: most start Chrome, and each runner has 4 vCPUs.
      - name: Browser tests (shard ${{ matrix.shard }}/2)
        timeout-minutes: 10
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(node -e '
            const fs = require("node:fs");
            const skip = new Set(["engine.test.mjs", "host.test.mjs", "jsonld-engine.test.mjs", "lsp.test.mjs"]);
            const list = fs.readdirSync("web/test")
              .filter((f) => f.endsWith(".test.mjs") && !skip.has(f))
              .map((f) => ({ f: `web/test/${f}`, s: fs.statSync(`web/test/${f}`).size }))
              .sort((a, b) => b.s - a.s || a.f.localeCompare(b.f));
            const bins = [[], []], sums = [0, 0];
            for (const x of list) {
              const k = sums[0] <= sums[1] ? 0 : 1;
              bins[k].push(x.f);
              sums[k] += x.s;
            }
            console.log(bins[Number(process.env.SHARD) - 1].join("\n"));
          ')
          echo "Running ${#files[@]} test files: ${files[*]}"
          test "${#files[@]}" -gt 0
          node --test --test-concurrency=2 --test-force-exit --test-timeout=60000 "${files[@]}"

  # Performance (bench/perf.mjs), with the shipped release profile. GitHub-hosted
  # runners share hardware, so the timings are noisy: the job reports and never
  # fails on a wall-clock figure. It compares with the artefact the last main run
  # uploaded (the p50 of the keystroke rows, marked over 1.5x) and writes the
  # table to the step summary; a push to main uploads its own results for the
  # next comparison. The benchmark still fails on a scenario that throws or an
  # expectation that fails. The memory budget runs in node-linux/node-macos as
  # well, where it gates.
  perf:
    name: Performance (ubuntu-latest, noisy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # `actions: read` lists and downloads the last main run's artefact.
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # The ratio a keystroke row is marked over: current p50 / main p50.
      PERF_MAX_RATIO: "1.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # The bench starts servers through test/lsp-client.mjs, which needs
      # vscode-jsonrpc.
      - run: npm ci
        timeout-minutes: 5
      - run: cargo build --release --locked
        timeout-minutes: 20
      - name: Benchmark
        id: bench
        timeout-minutes: 10
        run: node bench/perf.mjs --json bench-results.json
      # The newest unexpired bench-results artefact that a run on main uploaded.
      - name: Download the last main results
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-results&per_page=50" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "No earlier main results to compare with."
          else
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name bench-results --dir base
          fi
      - name: Compare with the last main results
        if: hashFiles('base/bench-results.json') != ''
        run: node bench/perf.mjs --compare base/bench-results.json bench-results.json --max-ratio "$PERF_MAX_RATIO"
      - name: Keep the results (main)
        if: always() && github.event_name == 'push' && steps.bench.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: error
          retention-days: 90

  # The action (action.yml) on each runner, against a real release: the one
  # place install.sh and install.ps1 download from GitHub. On PRs, runs only
  # when action.yml, install.sh or install.ps1 changed; always runs on main,
  # nightly and manual runs. Not in "CI passed": a GitHub download that fails
  # is not a fault of this code.
  install-action:
    name: Install action (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.install_action == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: install
        uses: ./
        with:
          version: v0.18.0
          verify-attestation: "true"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The installed turtle-lsp is on PATH
        shell: bash
        env:
          INSTALLED: ${{ steps.install.outputs.path }}
        run: |
          turtle-lsp --version | tee version.txt
          grep -qx 'turtle-lsp 0.18.0' version.txt
          test -f "$INSTALLED"

  # The one check the ruleset requires: every gating job must succeed (skipped,
  # cancelled or failed fails the gate). Not Performance or Install action.
  ci-ok:
    name: CI passed
    if: always()
    needs:
      - changes
      - lint
      - msrv
      - audit
      - build-linux
      - build-macos
      - build-windows
      - rust-tests
      - chaos
      - node-linux
      - node-macos
      - node-windows
      - vscode-linux
      - vscode-macos
      - vscode-windows
      - web-build
      - web-engine
      - web-browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          test -n "$RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed (saw: $r)" >&2
              exit 1
            fi
          done
